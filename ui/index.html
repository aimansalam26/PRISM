<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>PRISM · Impact review</title><link rel="stylesheet" href="/styles.css"><script src="/app.js" defer></script></head><body>
<header><strong>PRISM</strong><span>Impact review</span><button id="stop">Stop workspace</button></header>
<main><section class="panel controls"><label>Scenario or saved session<input id="file" type="file" accept=".json"></label><label>Maximum hops<select id="depth"><option>1</option><option>2</option><option selected>3</option></select></label><button id="run">Run analysis</button><button id="sample">Load bundled scenarios</button></section><p id="message" role="status"></p><p id="error" role="alert"></p>
<section id="results" hidden><div class="toolbar"><label>Scenario<select id="scenario"></select></label><label>Method<select id="mode"><option value="prism">PRISM · accumulated scope</option><option value="local">Local scope baseline</option><option value="untyped">Untyped reachability baseline</option></select></label><label>Filter<select id="filter"><option value="all">All candidates</option><option value="Yes">Definite review impact</option><option value="Defer">Possible impact</option><option value="No">No supported path</option></select></label></div>
<div id="metrics"></div><details><summary>Change and analysis boundary</summary><div id="event"></div></details><div class="layout"><aside id="queue" class="panel"></aside><article id="detail" class="panel"><p>Select a candidate.</p></article></div>
<section class="panel downloads"><strong>Download</strong><button data-export="session">Review session</button><button data-export="results">Results JSON</button><button data-export="csv">CSV</button><button data-export="xlsx">Excel</button><button data-export="markdown">Report</button></section>
<details class="panel"><summary>Evaluate against independently frozen labels</summary><label>Gold workbook<input id="gold" type="file" accept=".xlsx"></label><button id="evaluate">Evaluate</button><pre id="scores"></pre></details></section></main></body></html>
