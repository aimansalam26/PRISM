any beneficiary you choose.\r\n", "outgoing_links": []}, "SEC_GLOBAL_21": {"section_id": "SEC_GLOBAL_21", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Life Insurance Coverage"], "disclosure_title": "Life Insurance Key Details", "line_start": 175, "line_end": 189, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLife Insurance Key Details\u003c/summary\u003e\r\n\r\n**Key Details:**\r\n\r\n- Not applicable where separate entity-specific life insurance exists\r\n- Available to all other employees and direct contractors\r\n- You must choose the beneficiary (spouse, family, friend, or charity) via the instructions below\r\n- Part-time team members receive pro-rated coverage\r\n\r\n**How to Enroll:**\r\n\r\n- Follow [these Instructions](https://docs.google.com/document/d/1GWNaOwFJWKyoSA0ntQF5pCE9CJNaabFKO1UMZH25ifE/edit?tab=t.0) to fill out and upload your [Expression of Wishes form](https://docs.google.com/forms/d/e/1FAIpQLSdNSKQeWXrhG5hhYveF45wW-VmLz2a_Z7eNsk6XRQaAGtjZHQ/viewform?usp=preview) to Workday\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "these Instructions", "target_url": "https://docs.google.com/document/d/1GWNaOwFJWKyoSA0ntQF5pCE9CJNaabFKO1UMZH25ifE/edit?tab=t.0", "line_number": 187}, {"anchor_text": "Expression of Wishes form", "target_url": "https://docs.google.com/forms/d/e/1FAIpQLSdNSKQeWXrhG5hhYveF45wW-VmLz2a_Z7eNsk6XRQaAGtjZHQ/viewform?usp=preview", "line_number": 187}]}, "SEC_GLOBAL_22": {"section_id": "SEC_GLOBAL_22", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Vehicle Salary Sacrifice \u0026 Novated Leasing Programs"], "disclosure_title": null, "line_start": 191, "line_end": 193, "raw_text": "#### Vehicle Salary Sacrifice \u0026 Novated Leasing Programs\r\n\r\nGitLab has evaluated vehicle salary sacrifice and novated leasing programs across multiple regions (including Australia and the UK) and has decided not to offer these benefits at this time.\r\n", "outgoing_links": []}, "SEC_GLOBAL_23": {"section_id": "SEC_GLOBAL_23", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Vehicle Salary Sacrifice \u0026 Novated Leasing Programs"], "disclosure_title": "Background \u0026 Rationale", "line_start": 195, "line_end": 207, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eBackground \u0026 Rationale\u003c/summary\u003e\r\n\r\nThese programs typically allow team members to use pre-tax salary to cover vehicle costs (purchase, fuel, insurance, and maintenance) through a third-party provider. In some regions, government incentives such as Australia's [0% FBT exemption for eligible electric vehicles](https://www.ato.gov.au/businesses-and-organisations/hiring-and-paying-your-workers/fringe-benefits-tax/types-of-fringe-benefits/fbt-on-cars-other-vehicles-parking-and-tolls/electric-cars-exemption) or the UK's Electric Vehicle salary sacrifice scheme make these programs particularly attractive.\r\n\r\nAfter consultation with Legal and Finance, GitLab has decided not to proceed for the following reasons:\r\n\r\n- **Liability exposure:** Introducing any arrangement involving vehicles, even indirectly, creates operational and financial exposure that is difficult to manage within GitLab's structure as an all-remote organization.\r\n- **Financial reporting complexity:** FBT reporting obligations, payroll deduction management, and ongoing compliance requirements introduce a level of financial and administrative complexity that does not align with GitLab's operating model at this stage.\r\n\r\nThis is a company-wide position and is not specific to any single region. GitLab remains committed to offering competitive, locally relevant benefits and will continue to explore options that better align with the company's structure.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "0% FBT exemption for eligible electric vehicles", "target_url": "https://www.ato.gov.au/businesses-and-organisations/hiring-and-paying-your-workers/fringe-benefits-tax/types-of-fringe-benefits/fbt-on-cars-other-vehicles-parking-and-tolls/electric-cars-exemption", "line_number": 198}]}, "SEC_GLOBAL_24": {"section_id": "SEC_GLOBAL_24", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Growth and Development Fund"], "disclosure_title": null, "line_start": 209, "line_end": 213, "raw_text": "#### Growth and Development Fund\r\n\r\nYour professional growth matters to us and strengthens our entire team. That's why we provide up to $10,000 each year specifically for your career development.\r\n\r\nWhether you want to upskill with new certifications, attend industry conferences, or explore courses to enhance your expertise, this fund is designed to help you shape your career at GitLab while contributing to [High Performing Teams](https://internal.gitlab.com/handbook/company/high-performing-teams/) across the company.\r\n", "outgoing_links": [{"anchor_text": "High Performing Teams", "target_url": "https://internal.gitlab.com/handbook/company/high-performing-teams/", "line_number": 213}]}, "SEC_GLOBAL_25": {"section_id": "SEC_GLOBAL_25", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Growth and Development Fund"], "disclosure_title": "Growth and Development Fund details", "line_start": 215, "line_end": 224, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eGrowth and Development Fund details\u003c/summary\u003e\r\n\r\n**Eligibility:** All team members, subject to tenure, performance, and available budget\r\n\r\n**Coverage Period:** January 1st - December 31st (with grace period until end of January for December courses)\r\n\r\n**How to Apply:** Visit the [Growth and Development handbook](/handbook/people-group/learning-and-development/growth-and-development/) page for application process and eligible expenses.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Growth and Development handbook", "target_url": "/handbook/people-group/learning-and-development/growth-and-development/", "line_number": 222}]}, "SEC_GLOBAL_26": {"section_id": "SEC_GLOBAL_26", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Growth and Development Fund"], "disclosure_title": "Financial Wellness Resources", "line_start": 226, "line_end": 233, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eFinancial Wellness Resources\u003c/summary\u003e\r\n\r\nResources and guidance to support your financial wellbeing and help you work toward your financial goals.\r\n\r\n**How to Access:** Review available resources on the [Financial Wellness handbook page](/handbook/total-rewards/benefits/general-and-entity-benefits/financial-wellness/)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Financial Wellness handbook page", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/financial-wellness/", "line_number": 231}]}, "SEC_GLOBAL_27": {"section_id": "SEC_GLOBAL_27", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Time Off \u0026 Flexibility"], "disclosure_title": null, "line_start": 235, "line_end": 235, "raw_text": "### Time Off \u0026 Flexibility\r\n", "outgoing_links": []}, "SEC_GLOBAL_28": {"section_id": "SEC_GLOBAL_28", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Time Off \u0026 Flexibility", "Flexible Paid Time Off"], "disclosure_title": null, "line_start": 237, "line_end": 239, "raw_text": "#### Flexible Paid Time Off\r\n\r\nFlexible time off designed to support your overall well-being, with the option to take up to 25 consecutive calendar days for vacation. We understand that everyone needs different amounts of time to truly disconnect and recharge - whether for travel, family moments, personal growth, or simply rest. Review the [full policy details here.](/handbook/people-group/time-off-and-absence/time-off-types/#flexible-paid-time-off-pto)\r\n", "outgoing_links": [{"anchor_text": "full policy details here.", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/#flexible-paid-time-off-pto", "line_number": 239}]}, "SEC_GLOBAL_29": {"section_id": "SEC_GLOBAL_29", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Time Off \u0026 Flexibility", "All-Remote Work Environment"], "disclosure_title": null, "line_start": 241, "line_end": 245, "raw_text": "#### All-Remote Work Environment\r\n\r\nGitLab's [all-remote work environment](https://about.gitlab.com/blog/the-case-for-all-remote-companies/) provides the flexibility and support you need to thrive professionally while maintaining work-life balance. Our comprehensive remote work resources help you succeed from any location, backed by a global community of team members who share the remote lifestyle.\r\n\r\nWant to share your remote work experience? Add a remote_story: element to your team.yml entry.\r\n", "outgoing_links": [{"anchor_text": "all-remote work environment", "target_url": "https://about.gitlab.com/blog/the-case-for-all-remote-companies/", "line_number": 243}]}, "SEC_GLOBAL_30": {"section_id": "SEC_GLOBAL_30", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Leave of Absence Support with Tilt - :us: \u0026 :canada: only"], "disclosure_title": null, "line_start": 247, "line_end": 251, "raw_text": "### Leave of Absence Support with Tilt - :us: \u0026 :canada: only\r\n\r\nGitLab recognizes that navigating a leave of absence–whether expected or unexpected–can often be confusing and complex. We’re committed to support our team members during life’s most challenging or cherished moments, which is why we have partnered with Tilt to provide comprehensive leave management support for team members in the **US and Canada**.\r\n\r\n**Effective 2026-02-02**, Tilt will serve as the Third Party Administrator for leaves of absence in the US and Canada, streamlining processes, answering questions, and facilitating communication throughout your leave journey.\r\n", "outgoing_links": []}, "SEC_GLOBAL_31": {"section_id": "SEC_GLOBAL_31", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Leave of Absence Support with Tilt - :us: \u0026 :canada: only"], "disclosure_title": "Benefit Features", "line_start": 253, "line_end": 274, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eBenefit Features\u003c/summary\u003e\r\n\r\n**For US \u0026 Canada Team Members:**\r\n\r\n- **Resources:** Access to comprehensive guides on navigating various types of leaves (FMLA, state disability, parental leave, etc.).\r\n  - **:canada::** Tilt will administer **parental leaves only**. The Absence Management team will continue to be your administrator for medical or caregiving leaves.\r\n- **Practical Checklists:** Step-by-step guides.\r\n- **24/7 Access:** Platform available whenever you need support.\r\n- **Direct Support:** Leave specialists available to answer your questions.\r\n\r\n[Getting Started: A Tour of the Tilt Platform](https://www.loom.com/share/8a725a7c2a8b4b50bd82e746541e4feb?sid=090da1bb-d493-46c7-8737-508686b1005e)\r\n\r\n**For People Managers:**\r\n\r\n- **People Manager Resources:** People Managers will be able to easily see status on their team members leave of absence and reminders of return to work details.\r\n\r\n[Tilt Walkthrough Video](https://www.loom.com/share/5752ba41afc1414eb87c94a1781f6b67?sid=03be40ff-272c-413a-999a-82b68607fa33)\r\n\r\n**More Questions?** Please read this [FAQ article](https://theloop.gitlab.com/site/5ea8f77b-a0c3-4983-ba40-1463a96d8e21/page/93dba3b8-1035-404a-9102-40e34f330147) on the Loop!\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Getting Started: A Tour of the Tilt Platform", "target_url": "https://www.loom.com/share/8a725a7c2a8b4b50bd82e746541e4feb?sid=090da1bb-d493-46c7-8737-508686b1005e", "line_number": 264}, {"anchor_text": "Tilt Walkthrough Video", "target_url": "https://www.loom.com/share/5752ba41afc1414eb87c94a1781f6b67?sid=03be40ff-272c-413a-999a-82b68607fa33", "line_number": 270}, {"anchor_text": "FAQ article", "target_url": "https://theloop.gitlab.com/site/5ea8f77b-a0c3-4983-ba40-1463a96d8e21/page/93dba3b8-1035-404a-9102-40e34f330147", "line_number": 272}]}, "SEC_GLOBAL_32": {"section_id": "SEC_GLOBAL_32", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Leave of Absence Support with Tilt - :us: \u0026 :canada: only"], "disclosure_title": "How to Access", "line_start": 276, "line_end": 282, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n1. Access Tilt in your Okta account\r\n1. Explore the Quick Start Guide upon login\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_GLOBAL_33": {"section_id": "SEC_GLOBAL_33", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Leave of Absence Support with Tilt - :us: \u0026 :canada: only"], "disclosure_title": "Contact Details", "line_start": 284, "line_end": 289, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eContact Details\u003c/summary\u003e\r\n\r\nFor support, team members can contact Tilt directly at LeaveSupport@ourtilt.com, through the contact form, or text via (970) 449-0178. Team members can also reach out to the Tilt team to schedule a call and a Leave Specialist will send a scheduling link to set up time to chat live.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_GLOBAL_34": {"section_id": "SEC_GLOBAL_34", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support"], "disclosure_title": null, "line_start": 291, "line_end": 291, "raw_text": "### Travel, Community \u0026 Support\r\n", "outgoing_links": []}, "SEC_GLOBAL_35": {"section_id": "SEC_GLOBAL_35", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Business Travel Emergency Assistance \u0026 Accident Policy"], "disclosure_title": null, "line_start": 293, "line_end": 295, "raw_text": "#### Business Travel Emergency Assistance \u0026 Accident Policy\r\n\r\nWe've got you covered from departure to return. Our 24/7 medical, safety, and security assistance through International SOS keeps you safe during business travel, while our comprehensive travel insurance provides emergency medical coverage, baggage protection, and accident coverage for domestic and international trips. Focus on your work while we handle your safety and security.\r\n", "outgoing_links": []}, "SEC_GLOBAL_36": {"section_id": "SEC_GLOBAL_36", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Business Travel Emergency Assistance \u0026 Accident Policy"], "disclosure_title": "Business Travel Emergency Assistance Details", "line_start": 297, "line_end": 309, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eBusiness Travel Emergency Assistance Details\u003c/summary\u003e\r\n\r\n**Coverage:** Automatic year-round coverage for all team members\r\n\r\n**How to Access:**\r\n\r\n- Download the [ISOS emergency app](https://apps.apple.com/us/app/international-sos-assistance/id465662561) using your GitLab email\r\n- Note that this is not a GitLab application and is managed by ISOS. You can read more about the app [here](https://www.internationalsos.com/subscriber/assistance-app).\r\n- Press \"Need Assistance\" for immediate support\r\n- Alternative: Use [membership card](https://www.internationalsos.com/Private/NET_StandardMembershipCards/comprehensive.aspx?CustomerNumber=401GDA935395IT\u0026CompanyID=GitLab%2c+Inc.\u0026ProgramName=Assignee+%26+International+Traveler+Assistance\u0026PhoneNum1=Philadelphia+++%2b1+215+942+8226\u0026PhoneNum2=Sydney+++%2b61+2+9372+2468\u0026PhoneNum3=London+++%2b44+%280%2920+8762+8008\u0026PhoneNum4=Singapore+++%2b65+6338+7800\u0026Language=en-US) with emergency contact details\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "ISOS emergency app", "target_url": "https://apps.apple.com/us/app/international-sos-assistance/id465662561", "line_number": 304}, {"anchor_text": "here", "target_url": "https://www.internationalsos.com/subscriber/assistance-app", "line_number": 305}, {"anchor_text": "membership card", "target_url": "https://www.internationalsos.com/Private/NET_StandardMembershipCards/comprehensive.aspx?CustomerNumber=401GDA935395IT\u0026CompanyID=GitLab%2c+Inc.\u0026ProgramName=Assignee+%26+International+Traveler+Assistance\u0026PhoneNum1=Philadelphia+++%2b1+215+942+8226\u0026PhoneNum2=Sydney+++%2b61+2+9372+2468\u0026PhoneNum3=London+++%2b44+%280%2920+8762+8008\u0026PhoneNum4=Singapore+++%2b65+6338+7800\u0026Language=en-US", "line_number": 307}]}, "SEC_GLOBAL_37": {"section_id": "SEC_GLOBAL_37", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Business Travel Emergency Assistance \u0026 Accident Policy"], "disclosure_title": "Business Travel Accident Policy Details  - (Business Travel Insurance)", "line_start": 311, "line_end": 335, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eBusiness Travel Accident Policy Details  - (Business Travel Insurance)\u003c/summary\u003e\r\n\r\nTeam Members can review the [Chubb Business Travel Accident Policy](https://drive.google.com/file/d/1XEP4ZBvmlq0HlY_ykKfBivJPw6Wq1CTG/view?usp=sharing).\r\n\r\n**Coverage Includes:**\r\n\r\n- Accidental Death: 5x annual salary up to $500,000\r\n- Out of Country medical expense benefit: Up to $250,000 per occurrence\r\n- Emergency medical benefit: up to $10,000\r\n- Security evacuation: Maximum $100,000. Natural disaster coverage must be within 7 days of the event.\r\n- Limited Personal deviation coverage: up to 14 days\r\n- Baggage protection: baggage delay up to $2,500 per trip; lost baggage up to $2,500 per trip, subject to $1,250 per item/set and max 2 bags.\r\n\r\n**Trip Duration:** Coverage for trips up to 365 days\r\n\r\n**Additional Resource:** Chubb Travel Assistance App for emergency travel support\r\n\r\n**How to Submit a claim:**\r\nWithin the U.S.: (+1) 800-336-0627\r\nOutside the U.S.: (+1) 302-476-6194\r\nEmail: ChubbAandHClaims@Chubb.com\r\nMail claims to: Chubb NA Accident \u0026 Health, PO Box 816, Portland, ME 04104\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Chubb Business Travel Accident Policy", "target_url": "https://drive.google.com/file/d/1XEP4ZBvmlq0HlY_ykKfBivJPw6Wq1CTG/view?usp=sharing", "line_number": 314}]}, "SEC_GLOBAL_38": {"section_id": "SEC_GLOBAL_38", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Meal Train"], "disclosure_title": null, "line_start": 337, "line_end": 339, "raw_text": "#### Meal Train\r\n\r\nLife's unexpected moments are easier to navigate when you know your community has your back. Our Meal Train program allows team members to support colleagues going through difficult times or major life transitions by organizing meal deliveries - a simple but meaningful way to show care and provide practical help when someone needs it most.\r\n", "outgoing_links": []}, "SEC_GLOBAL_39": {"section_id": "SEC_GLOBAL_39", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Meal Train"], "disclosure_title": "Meal Train Details and Instructions", "line_start": 341, "line_end": 354, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eMeal Train Details and Instructions\u003c/summary\u003e\r\n\r\n**Examples of when someone may request a meal train (this list isn't exhaustive):**\r\n\r\n- Arrival of a new baby\r\n- Injuries/Surgeries\r\n- Military deployment\r\n- Extended illnesses\r\n- Condolences\r\n\r\nSee the [GitLab Meal Train Guide](https://docs.google.com/document/d/1JP0xnjKIxcIC2hN2gVR07ksj_j14B90QLZkd-7k-9O4/edit?tab=t.0) for details on how to Start a Meal Train and Participation Instructions\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "GitLab Meal Train Guide", "target_url": "https://docs.google.com/document/d/1JP0xnjKIxcIC2hN2gVR07ksj_j14B90QLZkd-7k-9O4/edit?tab=t.0", "line_number": 352}]}, "SEC_GLOBAL_40": {"section_id": "SEC_GLOBAL_40", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "GitLab Cares - Disaster Relief Program"], "disclosure_title": null, "line_start": 356, "line_end": 358, "raw_text": "#### GitLab Cares - Disaster Relief Program\r\n\r\nWhen natural disasters or unexpected emergencies create financial hardship, GitLab's Team Member Relief Program is here to help. Managed through our partnership with E4E Relief, this program provides short-term financial assistance to team members and their families during times of extreme need.\r\n", "outgoing_links": []}, "SEC_GLOBAL_41": {"section_id": "SEC_GLOBAL_41", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "GitLab Cares - Disaster Relief Program"], "disclosure_title": "Disaster Relief Program Details", "line_start": 360, "line_end": 373, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eDisaster Relief Program Details\u003c/summary\u003e\r\n\r\n**How It Works:** Whether you're affected by fires, earthquakes, floods, or other emergencies, visit the GitLab Cares Portal to check your eligibility and apply for assistance. The process is designed to be straightforward when you're already dealing with difficult circumstances.\r\n\r\n**Community Support:** GitLab established this fund with an initial contribution, and team members can choose to support their colleagues by making tax-deductible donations through the portal. Your contributions help ensure this safety net is available when fellow team members need it most.\r\n\r\n**Get Help or Contribute:**\r\n\r\n- **Need assistance?** Visit the [GitLab Cares Portal](/handbook/total-rewards/benefits/general-and-entity-benefits/#gitlab-cares---disaster-relief-program) to check eligibility and apply\r\n- **Want to contribute?** Select 'Contribute to the Fund' on the portal\r\n- **Tax Benefits:** Donations are tax-deductible (country-specific tax laws apply)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "GitLab Cares Portal", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#gitlab-cares---disaster-relief-program", "line_number": 369}]}, "SEC_GLOBAL_42": {"section_id": "SEC_GLOBAL_42", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Bereave Support Benefits"], "disclosure_title": null, "line_start": 375, "line_end": 379, "raw_text": "#### Bereave Support Benefits\r\n\r\nGitLab recognizes that navigating loss and grief are among life's most challenging experiences. We've partnered with [Bereave](https://www.bereave.io/) to provide comprehensive support for team members during these difficult times.\r\n\r\n**Effective 2026-01-01**, All GitLab team members have access to [Bereavement Support Benefits](https://drive.google.com/file/d/1cl4KvZ7OVEbPKppZg9unadF6FypuRUDh/view?usp=sharing) through Bereave.\r\n", "outgoing_links": [{"anchor_text": "Bereave", "target_url": "https://www.bereave.io/", "line_number": 377}, {"anchor_text": "Bereavement Support Benefits", "target_url": "https://drive.google.com/file/d/1cl4KvZ7OVEbPKppZg9unadF6FypuRUDh/view?usp=sharing", "line_number": 379}]}, "SEC_GLOBAL_43": {"section_id": "SEC_GLOBAL_43", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Bereave Support Benefits"], "disclosure_title": "Benefit Features", "line_start": 381, "line_end": 401, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eBenefit Features\u003c/summary\u003e\r\n\r\n**For All Team Members**:\r\n\r\n- Grief Support Resources: Access to comprehensive guides on navigating various types of loss\r\n- Practical Checklists: Step-by-step guides for handling logistics during bereavement\r\n- Support Networks: Resources for supporting colleagues, friends, and family members experiencing loss\r\n- Family Collaboration: Ability to invite family members to collaborate on platform resources\r\n- 24/7 Access: Platform available whenever you need support\r\n- [Getting Started: A Tour of the Bereave Platform](https://www.youtube.com/watch?v=eaGNnMpKrUs)\r\n\r\n**For Managers**:\r\n\r\n- People Manager Resources: Specialized content on supporting grieving team members\r\n- Coaching Support: Access to expert guidance during critical situations\r\n- Communication Tools: Templates and guides for sensitive conversations\r\n- Team Support Strategies: Best practices for maintaining team cohesion during difficult times\r\n- [Bereave Tour Walkthrough](https://www.youtube.com/watch?v=NmMhMPfHaJs) for Managers\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Getting Started: A Tour of the Bereave Platform", "target_url": "https://www.youtube.com/watch?v=eaGNnMpKrUs", "line_number": 391}, {"anchor_text": "Bereave Tour Walkthrough", "target_url": "https://www.youtube.com/watch?v=NmMhMPfHaJs", "line_number": 399}]}, "SEC_GLOBAL_44": {"section_id": "SEC_GLOBAL_44", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Bereave Support Benefits"], "disclosure_title": "How to Access", "line_start": 403, "line_end": 408, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\nLog into Bereave via [Okta](https://gitlab.okta.com/app/UserHome).\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Okta", "target_url": "https://gitlab.okta.com/app/UserHome", "line_number": 406}]}, "SEC_GLOBAL_45": {"section_id": "SEC_GLOBAL_45", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Bereave Support Benefits"], "disclosure_title": "Resources", "line_start": 410, "line_end": 415, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eResources\u003c/summary\u003e\r\n\r\n- [Bereave FAQs](https://docs.google.com/document/d/1kdud9Z6GpamFcufdhKCPHzVuNHTuo3t71yUmODg79LA/edit?usp=sharing)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Bereave FAQs", "target_url": "https://docs.google.com/document/d/1kdud9Z6GpamFcufdhKCPHzVuNHTuo3t71yUmODg79LA/edit?usp=sharing", "line_number": 413}]}, "SEC_GLOBAL_46": {"section_id": "SEC_GLOBAL_46", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Travel, Community \u0026 Support", "Bereave Support Benefits"], "disclosure_title": "Contact Details", "line_start": 417, "line_end": 422, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eContact Details\u003c/summary\u003e\r\n\r\nFor support, contact Bereave directly at help@bereave.io or through the platform's messaging feature.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_GLOBAL_47": {"section_id": "SEC_GLOBAL_47", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Contractor Benefits"], "disclosure_title": null, "line_start": 424, "line_end": 426, "raw_text": "## Contractor Benefits\r\n\r\nGitLab IT BV contractors are eligible for company-wide benefits but not entity-specific benefits. Contractors are responsible for their own health insurance, social security taxes, and payroll administration.\r\n", "outgoing_links": []}, "SEC_GLOBAL_48": {"section_id": "SEC_GLOBAL_48", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Important Notes"], "disclosure_title": null, "line_start": 428, "line_end": 432, "raw_text": "## Important Notes\r\n\r\n**Benefits Information:** This summary provides key information about your benefits. Complete terms and conditions are outlined in official policy documents and entity-specific materials.\r\n\r\n**Changes and Updates:** GitLab continues to evaluate and enhance benefit offerings. We'll communicate any changes through official channels.\r\n", "outgoing_links": []}, "SEC_GLOBAL_49": {"section_id": "SEC_GLOBAL_49", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "GitLab Cares - Team Member Disaster Relief Program"], "disclosure_title": null, "line_start": 434, "line_end": 440, "raw_text": "## GitLab Cares - Team Member Disaster Relief Program\r\n\r\nWhen Team Members are affected by natural disasters such as fires, earthquakes, floods, etc..., GitLab has established a Team Member Relief Program to assist with financial hardship from these disasters or other emergencies. This program is managed in partnership with E4E Relief, a non-profit that helps businesses establish global disaster relief programs for their Team Members.\r\n\r\nThis program provides Team Members and their families with short-term, need-based assistance in times of extreme need. If you experience a difficult situation, please visit the [GitLab Cares Portal](https://gitlab.e4erelief.org/) to easily determine if you're eligible for program assistance and to apply for assistance.\r\n\r\nGitLab started the fund with an initial contribution to support team members. Team Members may also choose to make donations to the fund as part of their annual giving and donation efforts. If you wish to make a donation, please visit the Portal and select 'Contribute to the Fund'. Donations are tax-deductable (country-specific tax laws apply).\r\n", "outgoing_links": [{"anchor_text": "GitLab Cares Portal", "target_url": "https://gitlab.e4erelief.org/", "line_number": 438}]}, "SEC_LEAVE_01": {"section_id": "SEC_LEAVE_01", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "GitLab Parental Leave"], "disclosure_title": null, "line_start": 6, "line_end": 8, "raw_text": "## GitLab Parental Leave\r\n\r\n*GitLab’s paid Parental Leave is available for any active team member (regardless of gender) who becomes a parent through childbirth or adoption while working at GitLab. The information in this section is specific to GitLab’s 16-week paid Parental Leave. Different countries or US states may provide team members with their own statutory Parental Leave benefits. Please review your [country/state](/handbook/total-rewards/benefits/general-and-entity-benefits/#entity-specific-benefits) Parental Leave benefits for more information on how to apply and tenure requirements (if applicable).*\r\n", "outgoing_links": [{"anchor_text": "country/state", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#entity-specific-benefits", "line_number": 8}]}, "SEC_LEAVE_02": {"section_id": "SEC_LEAVE_02", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "GitLab Parental Leave", "Eligibility, Entitlement and Planning Your Leave"], "disclosure_title": null, "line_start": 10, "line_end": 30, "raw_text": "### Eligibility, Entitlement and Planning Your Leave\r\n\r\nGitLab's Parental Leave is available for any active team member (regardless of gender) who becomes a parent through childbirth, adoption, fostering, or surrogacy (intended parent) while working at GitLab. This benefit is available from your first day of employment, provided your child was born, newly adopted, newly placed in your foster care, or born via surrogacy during your employment at GitLab.\r\n\r\nGitLab provides 16 weeks of paid Parental Leave, which must be used prior to the child's first birthday, the first anniversary of the adoption, the first anniversary of the foster placement, or the first anniversary of the birth (for surrogacy). Team members are encouraged to decide for themselves how much time they'd like to take, but there are some parameters to keep in mind when planning your leave:\r\n\r\n- We encourage you to begin your leave when your child arrives to maximize time with your family. If you prefer to start on a different date, please connect with the Absence Management team to review your request.\r\n- You may take your Parental Leave all at once or split it into up to three segments. Read more [here](/handbook/people-group/time-off-and-absence/time-away-philosophy/#communicating--preparing-for-planned-time-away) about how you should communicate and prepare for planned time away.\r\n- When calculating leave dates, GitLab uses a 1/7 formula (1 week = 7 days), meaning if you return on a Monday, your leave ends on Sunday.\r\n- If your Parental Leave falls within the 4 scheduled Family and Friends Days, your parental leave will be extended by 4 days.\r\n- ***FAQ: What happens with public holidays while I'm on Parental Leave?***\r\n  - [GitLab’s Public Holiday](/handbook/people-group/time-off-and-absence/time-off-types/#public-holiday) policy provides each team member with a public holiday balance to use flexibly to celebrate what’s important to them and must be used within that calendar year. Unused public holidays will not rollover to the next calendar year while on parental leave, unless statutorily required by law.\r\n- Coverage planning: We expect all team members taking parental leave to work with their manager to develop a strong coverage plan before they start their leave (when possible). If you would like support with coverage planning - or other career and transition support - check out [Parentaly](/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave-support-parentaly).\r\n\r\n*As you prepare for your parental leave, please note the following:*\r\n\r\n- **No Work Required During Your Leave:** You are not required to log into any GitLab systems, review or approve compensation documents, or respond to any work-related emails or deadlines.\r\n- **Automated System Emails:** You may receive automated emails from our systems during your leave. **Please disregard these emails** - they do not require any action from you.\r\n- **Approvals:** Any required approvals will be handled by the team or when you return from leave. You will not be disadvantaged for being unable to complete approvals during your protected leave period, and your compensation components will be preserved and addressed appropriately upon your return.\r\n\r\nIf you have questions before your leave begins, please contact leaves@gitlab.com.\r\n", "outgoing_links": [{"anchor_text": "here", "target_url": "/handbook/people-group/time-off-and-absence/time-away-philosophy/#communicating--preparing-for-planned-time-away", "line_number": 17}, {"anchor_text": "GitLab’s Public Holiday", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/#public-holiday", "line_number": 21}, {"anchor_text": "Parentaly", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave-support-parentaly", "line_number": 22}]}, "SEC_LEAVE_03": {"section_id": "SEC_LEAVE_03", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "GitLab Parental Leave", "Supplement with Paid Time Off"], "disclosure_title": null, "line_start": 32, "line_end": 40, "raw_text": "### Supplement with Paid Time Off\r\n\r\nIf you need additional time after your Parental Leave:\r\n\r\n- You may utilize [GitLab's Flexible Paid Time Off](/handbook/people-group/time-off-and-absence/time-off-types/#flexible-paid-time-off-pto) policy with manager coordination. If business critical deadlines will be missed, your Manager may ask you to change the dates.\r\n- Discuss this with your manager following standard PTO guidelines (double the amount of notice as time requested).\r\n- Submit PTO dates in Workday by selecting \"Paid Time Off\" and notify the Absence Management team.\r\n\r\nYou may not extend paid parental leave through the use of Paid [Caregiver Sick Time](/handbook/people-group/time-off-and-absence/time-off-types/#caregiver-sick-time), unless you have a family member with a serious health condition.\r\n", "outgoing_links": [{"anchor_text": "GitLab's Flexible Paid Time Off", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/#flexible-paid-time-off-pto", "line_number": 36}, {"anchor_text": "Caregiver Sick Time", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/#caregiver-sick-time", "line_number": 40}]}, "SEC_LEAVE_04": {"section_id": "SEC_LEAVE_04", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "GitLab Parental Leave", "How to Initiate Your Leave"], "disclosure_title": null, "line_start": 42, "line_end": 55, "raw_text": "### How to Initiate Your Leave\r\n\r\n1. **Share when comfortable**: You can share your news with your manager whenever you feel ready, but we recommend communicating 2-3 months before your leave starts for workload planning.\r\n1. **30-45 days prior to leave**: *remember to review your [location's reporting requirements](/handbook/total-rewards/benefits/general-and-entity-benefits/#entity-specific-benefits)!*\r\n\r\n**USA and Canada:** Please submit your Parental Leave request to Tilt (accessed through Okta). Once your request is submitted, it takes 2-5 business days to build your personalized leave plan. You will receive a notification when it is ready. If you have questions about your leave, you should contact Tilt directly at LeaveSupport@ourtilt.com, through the contact form, or text via (970) 449-0178. Team members can also reach out to the Tilt team to schedule a call and a Leave Specialist will send a scheduling link to set up time to chat live.\r\n\r\n**All other Locations:** Enter your Parental Leave into Workday by selecting the \"GitLab Parental Leave\" option under the Leaves dropdown menu.\r\n\r\n- This request will route to the Absence Management team who will gather information and next steps relevant to your location. You can expect to receive an email within 48 hours of your submission (please keep in mind that this may vary depending on your timezone).\r\n- **We understand that babies arrive on their own schedule!** If you need to change your leave dates, please contact the Absence Management team to make those edits, as team members cannot edit dates themselves once the request has been approved in Workday.\r\n- For adoptions where 30-day notice isn't possible, notify your manager as soon as possible and enter the dates into Workday when you can.\r\n\r\n***FAQ: Do I need to submit any paperwork?***  Yes, and this will vary depending on your location. Details of what is needed will be shared with you by the Absence Management team once they’ve had a chance to review your request and gather all relevant information. However, please be prepared to share proof of birth/relationship and/or adoption within 15 calendar days from the start of your leave. This can include a picture of the crib card, copy of paperwork from the hospital or birth center, or documentation with your child’s date of birth/placement noted. Documentation can be emailed to the Absence Management team at leaves@gitlab.com.\r\n", "outgoing_links": [{"anchor_text": "location's reporting requirements", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#entity-specific-benefits", "line_number": 45}]}, "SEC_LEAVE_05": {"section_id": "SEC_LEAVE_05", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "GitLab Parental Leave", "Pay While on Parental Leave"], "disclosure_title": null, "line_start": 57, "line_end": 63, "raw_text": "### Pay While on Parental Leave\r\n\r\nEligible team members will receive 100% of their weekly wages through the GitLab Paid Parental Leave. If you live in a country or US state where a statutory benefit is available, you will be *required* to apply for statutory leave pay (if eligible), and GitLab will supplement your pay to equal 100% of your weekly wages. You will not receive more than 100% of your wages with statutory leave and Parental Leave combined.\r\n\r\n***FAQ: I’m in a Sales role and receive commission. How is that impacted while on Parental Leave?***\r\n\r\n- For information about attainment, quota, or commissions while on parental leave, [this policy](https://internal.gitlab.com/handbook/sales/sales-commission/#leave-of-absences) found in the internal handbook may help. If this doesn't answer your questions or you have specific questions about your scenario, please submit a Compass ticket to the sales commission team directly, as they administer the Sales Incentives policies that apply for commission eligible team members on LOA.\r\n", "outgoing_links": [{"anchor_text": "this policy", "target_url": "https://internal.gitlab.com/handbook/sales/sales-commission/#leave-of-absences", "line_number": 63}]}, "SEC_LEAVE_06": {"section_id": "SEC_LEAVE_06", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "GitLab Parental Leave", "Returning to Work"], "disclosure_title": null, "line_start": 65, "line_end": 71, "raw_text": "### Returning to Work\r\n\r\nIt’s important to acknowledge that returning to work after Parental Leave can be difficult. Even with smooth reentries, life and work interplay differently when one adds another member to their family. Everyone transitions differently, and the impact on an individual varies depending on role, as well as a litany of personal factors.\r\n\r\nAbout a week before your expected return, the Absence Management team will send you a welcome back email which will share resources and ask you to confirm your return to work date. **Please respond by confirming the date you will return.**\r\n\r\nMore Return-to-work Resources shared [here](/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave).\r\n", "outgoing_links": [{"anchor_text": "here", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave", "line_number": 71}]}, "SEC_LEAVE_07": {"section_id": "SEC_LEAVE_07", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "GitLab Parental Leave", "Returning to Work at 50% Capacity"], "disclosure_title": null, "line_start": 73, "line_end": 87, "raw_text": "### Returning to Work at 50% Capacity\r\n\r\nReturning to work after parental leave can be challenging as you balance new family responsibilities while reintegrating into a workplace that has evolved during your absence.\r\n\r\nTo support this transition, GitLab offers team members the option to return at 50% capacity. This program is not tracked in Workday and does not require the Absence Management team’s review or approval. To utilize this benefit:\r\n\r\n- Discuss with your manager before starting leave or a few weeks prior to returning\r\n- Work together to determine a schedule that works for both you and your team\r\n- The standard guideline is two to four weeks at reduced capacity, though this can be adjusted based on individual needs\r\n- The 50% figure is flexible, and doesn’t always have to equate to working hours. Some options to consider would be:\r\n  - Adjusting the workload so you’re slowly ramping back up to a full plate - this won’t look the same for everyone - some team members may prefer to ramp up more quickly\r\n  - Adjust the working days/hours so instead of working 5-8hrs days it could be 4-10hrs, or you work really early in the morning/late in the evening\r\n  - Slowly increase the number of working days each week (i.e. 2 days the first week, 3 days the second, etc.)\r\n\r\nThis transition period gives you space to adjust to your new normal without the pressure of a full workload, allowing time to resolve any unexpected childcare challenges or other family adjustments.\r\n", "outgoing_links": []}, "SEC_LEAVE_08": {"section_id": "SEC_LEAVE_08", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Emergency Leave"], "disclosure_title": null, "line_start": 89, "line_end": 89, "raw_text": "## Emergency Leave\r\n", "outgoing_links": []}, "SEC_LEAVE_09": {"section_id": "SEC_LEAVE_09", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Emergency Leave", "Overview"], "disclosure_title": null, "line_start": 91, "line_end": 97, "raw_text": "### Overview\r\n\r\nAt GitLab, we understand that emergencies are by definition, unexpected. This policy establishes guidelines for emergency leave while maintaining our commitment to flexibility and support for team members during difficult times.\r\n\r\nEmergency leave provides paid time away from work to use in unexpected scenarios such as natural disasters, community emergencies, or any other catastrophe. This benefit is available to all team members on their first day of work.\r\n\r\nPlease note that GitLab also has an [Incident Response Plan](/handbook/people-group/incident-response/) in place, which outlines the action to be taken by the People Group in the instance that a team member or group of team members is impacted by an emergency event.\r\n", "outgoing_links": [{"anchor_text": "Incident Response Plan", "target_url": "/handbook/people-group/incident-response/", "line_number": 97}]}, "SEC_LEAVE_10": {"section_id": "SEC_LEAVE_10", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Emergency Leave", "Overview"], "disclosure_title": "Emergency Leave Request Process", "line_start": 99, "line_end": 100, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eEmergency Leave Request Process\u003c/summary\u003e\r\n", "outgoing_links": []}, "SEC_LEAVE_11": {"section_id": "SEC_LEAVE_11", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Emergency Leave", "How to Request"], "disclosure_title": "Emergency Leave Request Process", "line_start": 102, "line_end": 115, "raw_text": "### How to Request\r\n\r\nWe realize that advance notice may not always be possible in these circumstances. You should notify your manager as soon as you're able and enter dates in Workday when you can.\r\n\r\n1. Notify Your Manager: Inform your manager about your need for emergency leave as soon as possible. You only need to share details you're comfortable discussing. You can also work directly with the Absence Management team if you prefer (email leaves@gitlab.com).\r\n\r\n- More information about [Communicating Unplanned Time Away found here](/handbook/people-group/time-off-and-absence/time-away-philosophy/#communicating-unplanned-time-away)!\r\n\r\n1. Document in Workday: Enter your emergency leave request through the Workday app or Slack integration:\r\n\r\n- Select the day(s) you need \u003e Click \"Leaves\" \u003e Click \"Emergency Leave\" \u003e *Optional*: add a comment \u003e Click \"Submit\"\r\n- The Absence Management team will receive notification and contact you within 48 hours to confirm dates and provide additional information.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Communicating Unplanned Time Away found here", "target_url": "/handbook/people-group/time-off-and-absence/time-away-philosophy/#communicating-unplanned-time-away", "line_number": 108}]}, "SEC_LEAVE_12": {"section_id": "SEC_LEAVE_12", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Military Leave"], "disclosure_title": null, "line_start": 117, "line_end": 123, "raw_text": "## Military Leave\r\n\r\nGitLab is committed to protecting the rights of team members absent from work due to military leave. No team member or prospective team member will be subjected to any form of discrimination or retaliation on the basis of membership in or obligation to perform service for any of the uniformed services of the country where they work.\r\n\r\n- If any team member believes that they have been subjected to discrimination or retaliation in violation of this policy, immediately contact Team Member Relations for assistance.\r\n\r\nTeam Members may be eligible for statutory leave under their own country’s [Military Leave policies](/handbook/total-rewards/benefits/general-and-entity-benefits/#entity-specific-benefits). GitLab’s Military Leave policy is intended to supplement statutory military leave entitlements provided by the country where team members work.\r\n", "outgoing_links": [{"anchor_text": "Military Leave policies", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#entity-specific-benefits", "line_number": 123}]}, "SEC_LEAVE_13": {"section_id": "SEC_LEAVE_13", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Military Leave", "For leaves 31 days or less"], "disclosure_title": null, "line_start": 125, "line_end": 127, "raw_text": "### For leaves 31 days or less\r\n\r\n- No changes will be made to the team member’s job, pay, or benefits and team members will be eligible to return to their next working shift after their military service ends.\r\n", "outgoing_links": []}, "SEC_LEAVE_14": {"section_id": "SEC_LEAVE_14", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Military Leave", "For leaves greater than 31 days"], "disclosure_title": null, "line_start": 129, "line_end": 135, "raw_text": "### For leaves greater than 31 days\r\n\r\n- Team members reporting for active duty of more than 31 days may be eligible for up to 6 months of unpaid leave. Eligibility for the full 6 months will be determined by the team members’ statutory entitlement in their country as well as the needs of the business. If the leave is needed for more than 6 months, the team member will be offboarded (unless contrary to statutory requirements), but is eligible for reinstatement if able to return within the required timeframe.\r\n- Team members may elect to retain health care coverage benefits for up to 2 years, or to the end of their military service; whichever comes first, but team members will be responsible for making arrangements to pay the full cost of their benefits.\r\n  - If arrangements are not made or team members do not elect to retain their health care coverage, benefits will end as of the 31st day of military leave.\r\n  - Team members are eligible for immediate reinstatement of benefits upon their return to work, with no waiting period applied.\r\n- Team members will continue to vest stock while on unpaid military leave for up to 6 months (unless contrary to statutory requirements).\r\n", "outgoing_links": []}, "SEC_LEAVE_15": {"section_id": "SEC_LEAVE_15", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Military Leave", "Reinstatement"], "disclosure_title": null, "line_start": 137, "line_end": 150, "raw_text": "### Reinstatement\r\n\r\n- If a team member is offboarded from GitLab during the course of their Military service, they will be guaranteed reinstatement rights for up to 2 years after their service ends. Team members with disabilities have two years after their service ends—for purposes of recuperation and convalescence—to seek re-employment.\r\n\r\nTo be entitled to reinstatement, the following conditions must have been met:\r\n\r\n- The team member gave the employer notice of the need for military leave,\r\n- The team member was released under honorable conditions,\r\n- The team member returned and applied for re-employment within the following time restrictions:\r\n  - Leaves of less than 31 days: The team member must report to work on the first regularly scheduled work period following the completion of military service; no application is required.\r\n  - Leaves of more than 31 days but less than 180 days: The team member must apply for reinstatement within 14 days after completion of military service.\r\n  - Leaves of more than 180 days: The team member must apply for reinstatement no more than 90 days after completion of military service.\r\n\r\nWhen team members return from military service, they will be entitled to return to the position they would have attained if they had not been called to serve. This requirement is known as the “escalator principle.” The principle means that if the team member would have been promoted except for this leave of absence and if the team member is qualified to take the position now or can become qualified with reasonable efforts by GitLab, then GitLab must consider the team member for the promotion. If the team member is not or cannot become qualified, then GitLab will reinstate them to the job they held before the leave of absence or in a position of equivalent seniority, pay and status. In limited situations, if GitLab’s circumstances make reinstatement impossible—for example, in light of decreased business or impending layoffs—then GitLab’s obligation to reinstate the team member does not apply.\r\n", "outgoing_links": []}, "SEC_LEAVE_16": {"section_id": "SEC_LEAVE_16", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Military Leave", "How to Apply for Military Leave"], "disclosure_title": null, "line_start": 152, "line_end": 156, "raw_text": "### How to Apply for Military Leave\r\n\r\nTeam members should first review their own country’s Military Leave policies to ensure they are reporting their leave in accordance with any reporting requirements. Whenever possible team members need to provide at least 30 days advance notice by selecting Military Leave under the Leaves dropdown in Workday. GitLab reserves the right to request documentation related to the team member’s Military service. The Absence Management Team will contact you if documentation is needed.\r\n\r\n- For any questions about how to initiate a military leave or requests for reinstatement, please contact the Absence Management team by submitting a Compass ticket. For GitLab Inc or GitLab Federal team members, please additionally review the [Military Leave policy](/handbook/people-policies/leave-of-absence/us/#us-military-leave).\r\n", "outgoing_links": [{"anchor_text": "Military Leave policy", "target_url": "/handbook/people-policies/leave-of-absence/us/#us-military-leave", "line_number": 156}]}, "SEC_LEAVE_17": {"section_id": "SEC_LEAVE_17", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Sick Leave"], "disclosure_title": null, "line_start": 158, "line_end": 160, "raw_text": "## Sick Leave\r\n\r\nSick absences that are 6 days or longer are considered a leave of absence. You can read more about this [here](/handbook/people-group/time-off-and-absence/time-off-types/#for-sick-absences-that-exceed-6-consecutive-days).\r\n", "outgoing_links": [{"anchor_text": "here", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/#for-sick-absences-that-exceed-6-consecutive-days", "line_number": 160}]}, "SEC_LEAVE_18": {"section_id": "SEC_LEAVE_18", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Caregiving Sick Leave"], "disclosure_title": null, "line_start": 162, "line_end": 164, "raw_text": "## Caregiving Sick Leave\r\n\r\nCaregiver sick absences that are 6 days or longer are considered a leave of absence. You can read more about this [here](/handbook/people-group/time-off-and-absence/time-off-types/#for-caregiver-sick-absences-6-consecutive-days).\r\n", "outgoing_links": [{"anchor_text": "here", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/#for-caregiver-sick-absences-6-consecutive-days", "line_number": 164}]}, "SEC_LEAVE_19": {"section_id": "SEC_LEAVE_19", "source_file": "leave-types.md", "source_sha256": "625206862ee4f65178434e1bb24ae94f5d42c1ef2f29906b921f88d75b304d2e", "heading_path": ["Leave Types", "Equity Vesting During Leave"], "disclosure_title": null, "line_start": 166, "line_end": 170, "raw_text": "## Equity Vesting During Leave\r\n\r\nStock vesting is paused after six months of continuous leave and resumes on your first day back at work. Please note that this policy is applied in accordance with applicable local laws and statutory requirements, and may not apply in all locations or to all types of leave globally.\r\n\r\nFor complete details, please refer to our [Equity policy page](/handbook/total-rewards/stock-options/#equity-policies). If you have questions or concerns about how this applies to your specific situation, please submit a [Compass ticket](https://app.serval.com/new-request) to the Stock Admin team directly.\r\n", "outgoing_links": [{"anchor_text": "Equity policy page", "target_url": "/handbook/total-rewards/stock-options/#equity-policies", "line_number": 170}, {"anchor_text": "Compass ticket", "target_url": "https://app.serval.com/new-request", "line_number": 170}]}, "SEC_UK_01": {"section_id": "SEC_UK_01", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "We've Got You Covered"], "disclosure_title": null, "line_start": 6, "line_end": 11, "raw_text": "## We've Got You Covered\r\n\r\n**Clear Benefits, real support**\r\n\r\nAt GitLab, we believe team member benefits should be simple to understand and there when you need them. From life's big moments to everyday questions, our comprehensive coverage gives you clarity and confidence so you can focus on your work and life.\r\nIn addition to the local benefits listed below, all UK team members have access to the [company-wide benefits](/handbook/total-rewards/benefits/general-and-entity-benefits/) available to all team members globally.\r\n", "outgoing_links": [{"anchor_text": "company-wide benefits", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/", "line_number": 11}]}, "SEC_UK_02": {"section_id": "SEC_UK_02", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing"], "disclosure_title": null, "line_start": 13, "line_end": 13, "raw_text": "## Health \u0026 Wellbeing\r\n", "outgoing_links": []}, "SEC_UK_03": {"section_id": "SEC_UK_03", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "AXA PPP Medical Insurance"], "disclosure_title": null, "line_start": 15, "line_end": 19, "raw_text": "### AXA PPP Medical Insurance\r\n\r\nGitLab provides private medical insurance through AXA PPP to support your health and wellbeing. We cover 100% of your membership costs, and you can add family members with GitLab covering 66% of their costs.\r\n\r\n**Important:** Enrollment in the plan is not automatic. Team members must request enrollment to be covered. Team members are also responsible for any Benefit in Kind (BIK) tax that applies to this benefit. See the Benefit in Kind sections below for details.\r\n", "outgoing_links": []}, "SEC_UK_04": {"section_id": "SEC_UK_04", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "AXA PPP Medical Insurance"], "disclosure_title": "Eligibility Requirements", "line_start": 21, "line_end": 28, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eEligibility Requirements\u003c/summary\u003e\r\n\r\n- All UK-based team members\r\n- Coverage begins from your start date\r\n- No medical underwriting required—pre-existing conditions are covered. Current team members enrolled and new joiners to the AXA plan will have cover for treatment of pre-existing medical issues they may have had before joining, without being a member for two years or being required to have 12 consecutive months of \"trouble-free\" from when the condition began (pre-existing moratorium terms no longer apply).\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_05": {"section_id": "SEC_UK_05", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "AXA PPP Medical Insurance"], "disclosure_title": "Coverage \u0026 Key Features", "line_start": 30, "line_end": 42, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eCoverage \u0026 Key Features\u003c/summary\u003e\r\n\r\n- Full outpatient cover with £100 excess per member per plan year. The excess doesn't apply to Dental and Vision claims\r\n- Dental coverage: £400 per year (80% reimbursement)\r\n- Optical coverage: £200 per year (80% reimbursement) plus £25 for annual eye tests\r\n- Mental health support included\r\n- Complimentary virtual GP appointments through DR@Hand (excess doesn't apply)\r\n- [View the 2026 AXA PPP Brochure](https://drive.google.com/file/d/1y9pXVuvwxg9_0Vq1MGY5DmpFKUbSbQnj/view?usp=sharing)\r\n- [View the 2026 AXA Benefits Summary](https://drive.google.com/file/d/1zxDrPRh9kHAPZLm7tTauv9iIxSNINMxl/view?usp=sharing)\r\n- [Watch the 2026 AXA Webinar Recording](https://drive.google.com/file/d/107LkPA9PUtCfZ-z4NV6fUCQWdHmizdL_/view?usp=sharing)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "View the 2026 AXA PPP Brochure", "target_url": "https://drive.google.com/file/d/1y9pXVuvwxg9_0Vq1MGY5DmpFKUbSbQnj/view?usp=sharing", "line_number": 38}, {"anchor_text": "View the 2026 AXA Benefits Summary", "target_url": "https://drive.google.com/file/d/1zxDrPRh9kHAPZLm7tTauv9iIxSNINMxl/view?usp=sharing", "line_number": 39}, {"anchor_text": "Watch the 2026 AXA Webinar Recording", "target_url": "https://drive.google.com/file/d/107LkPA9PUtCfZ-z4NV6fUCQWdHmizdL_/view?usp=sharing", "line_number": 40}]}, "SEC_UK_06": {"section_id": "SEC_UK_06", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "AXA PPP Medical Insurance"], "disclosure_title": "How to Enroll/Access", "line_start": 44, "line_end": 56, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Enroll/Access\u003c/summary\u003e\r\n\r\nEmail total-rewards@gitlab.com and Lisa.Holland@wtwco.com with:\r\n\r\n- Your full name, date of birth, and current address\r\n- Employee ID\r\n- Family member details if adding dependents (name, DOB, address)\r\n- If you wish add/remove dependents after you have joined the plan, please reach out to total-rewards@gitlab.com and lisa.holland@wtw.com confirming your dependent details (Full Name, DOB, and address).\r\n\r\nPlease allow 7-10 working days for confirmation from AXA PPP. Team members who join the plan prior to the 24th of the month will have the BIK and deductions reported in full for that month, team members who join after the 24th of the will see deductions and BIK reporting begin the following month.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_07": {"section_id": "SEC_UK_07", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "AXA PPP Medical Insurance"], "disclosure_title": "Important Dates \u0026 Benefit Taxability", "line_start": 58, "line_end": 64, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eImportant Dates \u0026 Benefit Taxability\u003c/summary\u003e\r\n\r\n- **Enrollment deadline**: 24th of each month for coverage starting the following month\r\n- This is a **taxable benefit**—you'll pay Benefits in Kind (BIK) tax on the coverage value\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_08": {"section_id": "SEC_UK_08", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "AXA PPP Medical Insurance"], "disclosure_title": "Medical Premiums and Benefit In Kind Reporting", "line_start": 66, "line_end": 89, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eMedical Premiums and Benefit In Kind Reporting\u003c/summary\u003e\r\n\r\nPlease see the Annual 2026 Rates effective 2026-03-01:\r\n\r\n| Tier                     | Total| GitLab's Cover \u003cbr\u003e Benefit in Kind Value  | Team Member Cost \u003cbr\u003e 34% of Dependent Cost  |\r\n|--------------------------|:---:|:----:|:----:|\r\n| Team Member Only         | £1,099.00 | £1,099.00  | £0   |\r\n| Team Member + Spouse     | £2,198.00 | £1,824.34 | £373.66 |\r\n| Team Member + Child.     | £1,868.00 | £1,606.74 | £261.56 |\r\n| Family                   | £2,967.00  | £2,332.08 | £635.22 |\r\n\r\nPlease see the Monthly 2026 Rates effective 2026-03-01:\r\n\r\n| Tier                     | Total| GitLab's Cover \u003cbr\u003e Benefit in Kind Value  | Team Member Cost \u003cbr\u003e 34% of Dependent Cost  |\r\n|--------------------------|:---:|:----:|:----:|\r\n| Team Member Only         | £91.58 | £91.58  | £0   |\r\n| Team Member + Spouse     | £183.17 | £152.03 | £31.14 |\r\n| Team Member + Child.     | £155.69 | £133.89 | £21.80 |\r\n| Family                   | £247.28 | £194.34 | £52.94 |\r\n\r\nThe Team Member cost will be deducted from their paycheck on a monthly basis. The Benefit in Kind amount will be reported on a monthly basis and team members will be taxed on the value of the benefit. An audit and reconciliation of Benefit in Kind reporting and Deductions will occur annually around February.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_09": {"section_id": "SEC_UK_09", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "AXA PPP Medical Insurance"], "disclosure_title": "AXA Health Mobile App", "line_start": 91, "line_end": 97, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eAXA Health Mobile App\u003c/summary\u003e\r\n\r\n- Review the [guide](https://drive.google.com/file/d/18rAMY0f9yF3jMMRDNLbNdmjrO7DPhGEV/view?usp=sharing) on how to set-up your AXA Health Account via the app\r\n- Find The GitLab Access code on the Guide\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "guide", "target_url": "https://drive.google.com/file/d/18rAMY0f9yF3jMMRDNLbNdmjrO7DPhGEV/view?usp=sharing", "line_number": 94}]}, "SEC_UK_10": {"section_id": "SEC_UK_10", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "AXA PPP Medical Insurance"], "disclosure_title": "Contact Information", "line_start": 99, "line_end": 106, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eContact Information\u003c/summary\u003e\r\n\r\n- Total Rewards: total-rewards@gitlab.com\r\n- Willis Towers Watson: Lisa.Holland@wtwco.com\r\n- [Compass](https://app.serval.com/new-request) for claims support\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 104}]}, "SEC_UK_11": {"section_id": "SEC_UK_11", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "Vision"], "disclosure_title": null, "line_start": 108, "line_end": 115, "raw_text": "### Vision\r\n\r\n**Support for your eye health while working with display screens.**\r\n\r\nAs you work with display screens regularly, GitLab reimburses:\r\n\r\n- Up to £30 for eye examinations\r\n- Up to £120 for corrective lenses specifically required for display screen work (with optician's prescription confirming screen-only use)\r\n", "outgoing_links": []}, "SEC_UK_12": {"section_id": "SEC_UK_12", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "Vision"], "disclosure_title": "Eye Examination Reimbursement process", "line_start": 117, "line_end": 123, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eEye Examination Reimbursement process\u003c/summary\u003e\r\n\r\n1. Submit your receipt to Total Rewards for approval via [Compass](https://app.serval.com/new-request)\r\n2. Once approved by Total Rewards, please submit your expense through Navan attaching Total Rewards approval\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 120}]}, "SEC_UK_13": {"section_id": "SEC_UK_13", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "Vision"], "disclosure_title": "Corrective Lenses Reimbursement process", "line_start": 125, "line_end": 131, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eCorrective Lenses Reimbursement process\u003c/summary\u003e\r\n\r\n1. Submit your prescription to Total Rewards for approval via [Compass](https://app.serval.com/new-request)\r\n2. Once approved by Total Rewards, please submit your expense through Navan attaching Total Rewards approval\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 128}]}, "SEC_UK_14": {"section_id": "SEC_UK_14", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "Employee Assistance \u0026 Wellbeing Support"], "disclosure_title": null, "line_start": 133, "line_end": 137, "raw_text": "### Employee Assistance \u0026 Wellbeing Support\r\n\r\n**Resources available when you need them.**\r\n\r\nThrough our life insurance benefit with Unum, you have access to Employee Assistance and Wellbeing resources.\r\n", "outgoing_links": []}, "SEC_UK_15": {"section_id": "SEC_UK_15", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Health \u0026 Wellbeing", "Employee Assistance \u0026 Wellbeing Support"], "disclosure_title": "Help@Hand App", "line_start": 139, "line_end": 150, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHelp@Hand App\u003c/summary\u003e\r\n\r\n- Remote GP consultations\r\n- Physiotherapy support\r\n- Mental health resources\r\n- Medical second opinions\r\n- Life, money, and wellbeing guidance\r\n- New team members receive enrollment email in first week of month following hire\r\n- [Learn more about Help@Hand](https://drive.google.com/file/d/1mcq3dXDRsXvN5A7m1ZyfiIcppkdBxYW-/view?usp=sharing)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Learn more about Help@Hand", "target_url": "https://drive.google.com/file/d/1mcq3dXDRsXvN5A7m1ZyfiIcppkdBxYW-/view?usp=sharing", "line_number": 148}]}, "SEC_UK_16": {"section_id": "SEC_UK_16", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security"], "disclosure_title": null, "line_start": 152, "line_end": 152, "raw_text": "## Financial Security\r\n", "outgoing_links": []}, "SEC_UK_17": {"section_id": "SEC_UK_17", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Life Insurance"], "disclosure_title": null, "line_start": 154, "line_end": 156, "raw_text": "### Life Insurance\r\n\r\nProvides a tax-free lump sum payment to your loved ones, offering peace of mind during difficult times.\r\n", "outgoing_links": []}, "SEC_UK_18": {"section_id": "SEC_UK_18", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Life Insurance"], "disclosure_title": "Eligibility Requirements", "line_start": 158, "line_end": 164, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eEligibility Requirements\u003c/summary\u003e\r\n\r\n- All team members aged 16 to 75\r\n- Automatic en
