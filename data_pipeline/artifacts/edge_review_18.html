 "Derived from heading_path 'GitLab LTD (UK) Benefits, Time Off Policies, Sick Leave' and body text.", "duplicate_occurrence_of": null}}, "sections": {"SEC_NL_01": {"section_id": "SEC_NL_01", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "We've Got You Covered"], "disclosure_title": null, "line_start": 6, "line_end": 12, "raw_text": "## We've Got You Covered\r\n\r\n**Clear benefits, real support**\r\n\r\nAt GitLab, we believe team member benefits should be simple to understand and there when you need them. From life's big moments to everyday questions, our comprehensive coverage gives you clarity and confidence so you can focus on your work and life.\r\n\r\nIn addition to the local benefits listed below, all Netherlands team members have access to the [company-wide benefits](/handbook/total-rewards/benefits/general-and-entity-benefits/) available to all team members globally.\r\n", "outgoing_links": [{"anchor_text": "company-wide benefits", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/", "line_number": 12}]}, "SEC_NL_02": {"section_id": "SEC_NL_02", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Getting Support When You Need It"], "disclosure_title": null, "line_start": 14, "line_end": 16, "raw_text": "## Getting Support When You Need It\r\n\r\nCan't find what you're looking for? Visit the main [People Operations page](/handbook/people-group/).\r\n", "outgoing_links": [{"anchor_text": "People Operations page", "target_url": "/handbook/people-group/", "line_number": 16}]}, "SEC_NL_03": {"section_id": "SEC_NL_03", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Getting Support When You Need It", "Resources Available to You"], "disclosure_title": null, "line_start": 18, "line_end": 25, "raw_text": "### Resources Available to You\r\n\r\n| Team | Contact | For |\r\n| :---- | :---- | :---- |\r\n| People Connect | [Compass](https://app.serval.com/new-request) | General Benefits Questions |\r\n| Absence Management | [leaves@gitlab.com](mailto:leaves@gitlab.com)  | Leave and Sick Time |\r\n| HR Savvy | [payroll@savvy-group.eu](mailto:payroll@savvy-group.eu)  | Payroll and tax questions |\r\n| Non-US Payroll | [Compass](https://app.serval.com/new-request) | All general payroll-related inquiries  |\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 22}, {"anchor_text": "leaves@gitlab.com", "target_url": "mailto:leaves@gitlab.com", "line_number": 23}, {"anchor_text": "payroll@savvy-group.eu", "target_url": "mailto:payroll@savvy-group.eu", "line_number": 24}, {"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 25}]}, "SEC_NL_04": {"section_id": "SEC_NL_04", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing"], "disclosure_title": null, "line_start": 27, "line_end": 27, "raw_text": "## Health \u0026 Wellbeing\r\n", "outgoing_links": []}, "SEC_NL_05": {"section_id": "SEC_NL_05", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Medical Allowance"], "disclosure_title": null, "line_start": 29, "line_end": 31, "raw_text": "### Medical Allowance\r\n\r\nFull-time Netherlands team members receive a EUR 150 gross monthly allowance to help cover healthcare costs.\r\n", "outgoing_links": []}, "SEC_NL_06": {"section_id": "SEC_NL_06", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Medical Allowance"], "disclosure_title": "Eligibility Requirements", "line_start": 33, "line_end": 40, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eEligibility Requirements\u003c/summary\u003e\r\n\r\n* Full-time employment status\r\n* Based in the Netherlands\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_07": {"section_id": "SEC_NL_07", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Medical Allowance"], "disclosure_title": "Coverage \u0026 Key Features", "line_start": 42, "line_end": 52, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eCoverage \u0026 Key Features\u003c/summary\u003e\r\n\r\n* EUR 150 gross monthly payment via payroll\r\n* No documentation required\r\n* Continues during sick pay or unpaid parental leave\r\n* Prorated for mid-month starts/terminations\r\n* Subject to standard tax withholding\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_08": {"section_id": "SEC_NL_08", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Medical Allowance"], "disclosure_title": "Important Details", "line_start": 54, "line_end": 61, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eImportant Details\u003c/summary\u003e\r\n\r\n* You must still purchase your own basisverzekering (basic health insurance) as required by Dutch law\r\n* Not having health insurance can result in fines from the Sociale Verzekeringsbank\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_09": {"section_id": "SEC_NL_09", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "CZ Collective Healthcare Policy"], "disclosure_title": null, "line_start": 63, "line_end": 65, "raw_text": "### CZ Collective Healthcare Policy\r\n\r\nGitLab partners with [CZ](https://www.cz.nl/zorgverzekering/collectieve-zorgverzekering?015418634) to offer discounted supplementary insurance rates through our collective policy.\r\n", "outgoing_links": [{"anchor_text": "CZ", "target_url": "https://www.cz.nl/zorgverzekering/collectieve-zorgverzekering?015418634", "line_number": 65}]}, "SEC_NL_10": {"section_id": "SEC_NL_10", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "CZ Collective Healthcare Policy"], "disclosure_title": "Eligibility Requirements", "line_start": 67, "line_end": 74, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eEligibility Requirements\u003c/summary\u003e\r\n\r\n* All GitLab Netherlands team members\r\n* Can include dependents\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_11": {"section_id": "SEC_NL_11", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "CZ Collective Healthcare Policy"], "disclosure_title": "Coverage \u0026 Key Features", "line_start": 76, "line_end": 85, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eCoverage \u0026 Key Features\u003c/summary\u003e\r\n\r\n* Discounted rates on supplementary insurance\r\n* Direct payment to CZ via bank account\r\n* Annual enrollment period (end of year)\r\n* Not obligatory \\- you can choose any approved provider\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_12": {"section_id": "SEC_NL_12", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "CZ Collective Healthcare Policy"], "disclosure_title": "How to Enroll/Access", "line_start": 87, "line_end": 95, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Enroll/Access\u003c/summary\u003e\r\n\r\n* Review enrollment instructions in the [Netherlands CZ Collective Policy document](https://docs.google.com/document/d/1waw2rNECdmsinqqmtj4XNuL0zMQvFeyI17-0YBvKURM/edit)\r\n* Visit the [GitLab CZ page](https://www.cz.nl/zorgverzekering/collectieve-zorgverzekering?015418634)\r\n* Contact CZ directly at 088 555 7777 for questions\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Netherlands CZ Collective Policy document", "target_url": "https://docs.google.com/document/d/1waw2rNECdmsinqqmtj4XNuL0zMQvFeyI17-0YBvKURM/edit", "line_number": 91}, {"anchor_text": "GitLab CZ page", "target_url": "https://www.cz.nl/zorgverzekering/collectieve-zorgverzekering?015418634", "line_number": 92}]}, "SEC_NL_13": {"section_id": "SEC_NL_13", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "CZ Collective Healthcare Policy"], "disclosure_title": "Important Dates", "line_start": 97, "line_end": 105, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eImportant Dates\u003c/summary\u003e\r\n\r\n* Team members can enroll in the plans during the enrollment period at the end of each year\r\n* Team members must cancel their old insurance before January 1 and enroll in new insurance before February 1\\. The coverage will be retroactive to January 1\r\n* For more details, review the [Changing Health Insurance](https://www.government.nl/topics/health-insurance/standard-health-insurance/changing-your-health-insurance) page on the Netherlands Government Website\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Changing Health Insurance", "target_url": "https://www.government.nl/topics/health-insurance/standard-health-insurance/changing-your-health-insurance", "line_number": 103}]}, "SEC_NL_14": {"section_id": "SEC_NL_14", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Vision Reimbursement"], "disclosure_title": null, "line_start": 107, "line_end": 109, "raw_text": "### Vision Reimbursement\r\n\r\nTeam members experiencing eye problems from display screen work can receive up to EUR 250 reimbursement for corrective eyewear and an eye test required in connection with screen use. The EUR 250 benefit amount is a combined cap covering both the eye test and computer glasses together.\r\n", "outgoing_links": []}, "SEC_NL_15": {"section_id": "SEC_NL_15", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Vision Reimbursement"], "disclosure_title": "Eligibility Requirements", "line_start": 111, "line_end": 118, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eEligibility Requirements\u003c/summary\u003e\r\n\r\n* Must have optician documentation showing lenses are specifically for display screen work\r\n* Not for general daily use prescriptions\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_16": {"section_id": "SEC_NL_16", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Vision Reimbursement"], "disclosure_title": "How to Access", "line_start": 120, "line_end": 129, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n1. Get examined by an optician\r\n2. Send prescription and a copy of the eye test invoice to [total-rewards@gitlab.com](mailto:total-rewards@gitlab.com) for approval\r\n3. Once approved, submit reimbursement through Navan\r\n4. Select \"Other\" under Expense Type and \"Benefits Medical \u0026 Other\" under GL\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "total-rewards@gitlab.com", "target_url": "mailto:total-rewards@gitlab.com", "line_number": 125}]}, "SEC_NL_17": {"section_id": "SEC_NL_17", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Occupational Health Support"], "disclosure_title": null, "line_start": 131, "line_end": 133, "raw_text": "### Occupational Health Support\r\n\r\nAs required by the Working Conditions Act, GitLab provides occupational safety and health services to support team members unable to work due to illness.\r\n", "outgoing_links": []}, "SEC_NL_18": {"section_id": "SEC_NL_18", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Health \u0026 Wellbeing", "Occupational Health Support"], "disclosure_title": "Contact Information", "line_start": 135, "line_end": 143, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eContact Information\u003c/summary\u003e\r\n\r\n* Leuk Personeel\r\n* Dorresteinweg 72-08, 3763 LL, Soest, the Netherlands\r\n* Tel: \\+0355436137\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_19": {"section_id": "SEC_NL_19", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security"], "disclosure_title": null, "line_start": 145, "line_end": 145, "raw_text": "## Financial Security\r\n", "outgoing_links": []}, "SEC_NL_20": {"section_id": "SEC_NL_20", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security", "Vacation Money (Vakantiegeld)"], "disclosure_title": null, "line_start": 147, "line_end": 149, "raw_text": "### Vacation Money (Vakantiegeld)\r\n\r\nNetherlands team members receive the customary vacation money payment each May, as defined by the government.\r\n", "outgoing_links": []}, "SEC_NL_21": {"section_id": "SEC_NL_21", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security", "Vacation Money (Vakantiegeld)"], "disclosure_title": "Key Features", "line_start": 151, "line_end": 165, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eKey Features\u003c/summary\u003e\r\n\r\n* Paid annually in May\r\n* Amount determined by [government regulations](https://www.rijksoverheid.nl/onderwerpen/vakantiedagen-en-vakantiegeld/vraag-en-antwoord/hoe-hoog-is-mijn-vakantiegeld)\r\n\r\n* Statutory Sick Leave\r\n  * Team members who are unable to work due to illness are entitled to 70% of their salary for up to 104 weeks. This leave runs concurrently with GitLab's [Sick Time Policy](/handbook/people-group/time-off-and-absence/time-off-types/). Team members will receive 100% of their salary for the first 25 days of illness.\r\n  * GitLab complies with [Dutch local Laws](https://business.gov.nl/regulation/reporting-employee-illness-recovery/) regarding sick leave. Local laws override any leave policy we have in the benefit of the team members.\r\n  * Team members must select `Out Sick` in Workday to ensure that all sick time is properly tracked. For complete reporting procedures, please review [the sick time procedure for The Netherlands here](/handbook/people-group/time-off-and-absence/time-off-types/).\r\n* Statutory Vacation Leave\r\n  * Team members are entitled to at least 20 vacation days per year which run concurrently with GitLab PTO. The days will accrue at 1.67 days/month from the team member's start date. Any unused days will be carried into the next calendar year, but expire on July 1st. Should the team member leave GitLab within the calendar year, an entitlement to a pro rata part vacation days exists. Team members must designate all vacation days taken as `Paid Time OFF` in Workday to ensure that vacation entitlement is properly tracked.\r\n\r\n  \u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "government regulations", "target_url": "https://www.rijksoverheid.nl/onderwerpen/vakantiedagen-en-vakantiegeld/vraag-en-antwoord/hoe-hoog-is-mijn-vakantiegeld", "line_number": 156}, {"anchor_text": "Sick Time Policy", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/", "line_number": 159}, {"anchor_text": "Dutch local Laws", "target_url": "https://business.gov.nl/regulation/reporting-employee-illness-recovery/", "line_number": 160}, {"anchor_text": "the sick time procedure for The Netherlands here", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/", "line_number": 161}]}, "SEC_NL_22": {"section_id": "SEC_NL_22", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security", "Retirement Plan"], "disclosure_title": null, "line_start": 167, "line_end": 169, "raw_text": "### Retirement Plan\r\n\r\nStarting January 1, 2021, all team members over 21 receive a private pension plan through [ASR](https://www.asr.nl/zakelijk/pensioen/doenpensioen) (formerly Brand New Day) to supplement the standard state pension (AOW).\r\n", "outgoing_links": [{"anchor_text": "ASR", "target_url": "https://www.asr.nl/zakelijk/pensioen/doenpensioen", "line_number": 169}]}, "SEC_NL_23": {"section_id": "SEC_NL_23", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security", "Retirement Plan"], "disclosure_title": "Eligibility Requirements", "line_start": 171, "line_end": 179, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eEligibility Requirements\u003c/summary\u003e\r\n\r\n* Must be over 21 years old\r\n* Employed via GitLab BV Netherlands contract\r\n* Automatic enrollment upon hire\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_24": {"section_id": "SEC_NL_24", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security", "Retirement Plan"], "disclosure_title": "Key Features", "line_start": 181, "line_end": 193, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eKey Features\u003c/summary\u003e\r\n\r\n* Defined Contribution Agreement with 5% flat rate of pension base\r\n* You contribute 2%, GitLab contributes 3%\r\n* Build invested pension fund for retirement income\r\n* Death benefits for partner and children during service\r\n* Incapacity coverage continues contributions if you're unable to work\r\n* Option for voluntary additional contributions\r\n* Choice of investment profiles: neutral, defensive, offensive, or custom mix\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_25": {"section_id": "SEC_NL_25", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security", "Retirement Plan"], "disclosure_title": "How to Enroll/Access", "line_start": 195, "line_end": 203, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Enroll/Access\u003c/summary\u003e\r\n\r\n* Automatically enrolled through our Netherlands benefits partner\r\n* Contact ASR for questions or changes\r\n* Access training videos in the [ASR resource folder](https://drive.google.com/drive/folders/1qjCicb0JxnCmG5i4l3Hv5CEs5q8mOuXX?usp=sharing)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "ASR resource folder", "target_url": "https://drive.google.com/drive/folders/1qjCicb0JxnCmG5i4l3Hv5CEs5q8mOuXX?usp=sharing", "line_number": 201}]}, "SEC_NL_26": {"section_id": "SEC_NL_26", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security", "Retirement Plan"], "disclosure_title": "Important Details", "line_start": 205, "line_end": 213, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eImportant Details\u003c/summary\u003e\r\n\r\n* Team members can transfer pension value from former employer within 6 months\r\n* Review the [Pension Scheme document](https://drive.google.com/file/d/1FaC8sHe-r_PHz4xrXbNYlH2zCHAU972h/view?usp=sharing) for complete details\r\n* Learn about voluntary contributions in the [2024 ANW-gap pension guide](https://docs.google.com/document/d/1vHUp7koRsOMVZk87uMGIpU8QJ0NhRE7x/edit)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Pension Scheme document", "target_url": "https://drive.google.com/file/d/1FaC8sHe-r_PHz4xrXbNYlH2zCHAU972h/view?usp=sharing", "line_number": 210}, {"anchor_text": "2024 ANW-gap pension guide", "target_url": "https://docs.google.com/document/d/1vHUp7koRsOMVZk87uMGIpU8QJ0NhRE7x/edit", "line_number": 211}]}, "SEC_NL_27": {"section_id": "SEC_NL_27", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Financial Security", "Financial Wellbeing Support"], "disclosure_title": null, "line_start": 215, "line_end": 224, "raw_text": "### Financial Wellbeing Support\r\n\r\nGitLab's Netherlands pension provider, a.s.r., partners with Geldfit, a free and anonymous financial wellbeing service available to all Netherlands-based team members.\r\nGeldfit can help you with:\r\n\r\n* Questions about money and your financial situation\r\n* Insights and practical tools to support your financial health\r\n* Guidance on available support options\r\n\r\n[Get started (Dutch language)](https://geldfit.nl/welkom/asrzakelijk)\r\n", "outgoing_links": [{"anchor_text": "Get started (Dutch language)", "target_url": "https://geldfit.nl/welkom/asrzakelijk", "line_number": 224}]}, "SEC_NL_28": {"section_id": "SEC_NL_28", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Family \u0026 Life Transitions"], "disclosure_title": null, "line_start": 226, "line_end": 226, "raw_text": "## Family \u0026 Life Transitions\r\n", "outgoing_links": []}, "SEC_NL_29": {"section_id": "SEC_NL_29", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Family \u0026 Life Transitions", "Group Accident Insurance"], "disclosure_title": null, "line_start": 228, "line_end": 230, "raw_text": "### Group Accident Insurance\r\n\r\nAll Netherlands team members receive automatic accident insurance coverage at no cost, providing financial protection for you and your family.\r\n", "outgoing_links": []}, "SEC_NL_30": {"section_id": "SEC_NL_30", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Family \u0026 Life Transitions", "Group Accident Insurance"], "disclosure_title": "Coverage \u0026 Key Features", "line_start": 232, "line_end": 241, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eCoverage \u0026 Key Features\u003c/summary\u003e\r\n\r\n* 2x annual salary for death or permanent disability due to accident  \r\n* Maximum annual salary coverage: EUR 250,000  \r\n* Flat EUR 50,000 coverage for interns  \r\n* No enrollment required \\- automatic coverage\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_31": {"section_id": "SEC_NL_31", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Family \u0026 Life Transitions", "Group Accident Insurance"], "disclosure_title": "How to File a Claim", "line_start": 243, "line_end": 251, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to File a Claim\u003c/summary\u003e\r\n\r\n* Complete claim form ([English](https://drive.google.com/file/d/1btOAO8HaIndD3rNyy2ZGM2v6pOqd5qet/view?usp=sharing) or [Dutch](https://drive.google.com/file/d/1TXDy9-OHgifVUtBht_vWoQ8Vdnr59pMe/view?usp=sharing))  \r\n* Send to [total-rewards@gitlab.com](mailto:total-rewards@gitlab.com) immediately  \r\n* For death claims: submit at least 36 hours before funeral/cremation\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "English", "target_url": "https://drive.google.com/file/d/1btOAO8HaIndD3rNyy2ZGM2v6pOqd5qet/view?usp=sharing", "line_number": 247}, {"anchor_text": "Dutch", "target_url": "https://drive.google.com/file/d/1TXDy9-OHgifVUtBht_vWoQ8Vdnr59pMe/view?usp=sharing", "line_number": 247}, {"anchor_text": "total-rewards@gitlab.com", "target_url": "mailto:total-rewards@gitlab.com", "line_number": 248}]}, "SEC_NL_32": {"section_id": "SEC_NL_32", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Family \u0026 Life Transitions", "Group Accident Insurance"], "disclosure_title": "Important Details", "line_start": 253, "line_end": 260, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eImportant Details\u003c/summary\u003e\r\n\r\n* Review policy terms ([English](https://drive.google.com/file/d/10zMEoicyznarbiT_sJbwdKoQOdJb2rNK/view?usp=sharing) or [Dutch](https://drive.google.com/file/d/11dIBfZoIEIavIBYg-gWu7iZUbSxrnPJd/view?usp=sharing))  \r\n* Inform your spouse about this benefit\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "English", "target_url": "https://drive.google.com/file/d/10zMEoicyznarbiT_sJbwdKoQOdJb2rNK/view?usp=sharing", "line_number": 257}, {"anchor_text": "Dutch", "target_url": "https://drive.google.com/file/d/11dIBfZoIEIavIBYg-gWu7iZUbSxrnPJd/view?usp=sharing", "line_number": 257}]}, "SEC_NL_33": {"section_id": "SEC_NL_33", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Family \u0026 Life Transitions", "Life Insurance Through Pension"], "disclosure_title": null, "line_start": 262, "line_end": 264, "raw_text": "### Life Insurance Through Pension\r\n\r\nDeath benefits are included in your pension scheme to protect your loved ones.\r\n", "outgoing_links": []}, "SEC_NL_34": {"section_id": "SEC_NL_34", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Family \u0026 Life Transitions", "Life Insurance Through Pension"], "disclosure_title": "Coverage \u0026 Key Features", "line_start": 266, "line_end": 274, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eCoverage \u0026 Key Features\u003c/summary\u003e\r\n\r\n* Lifelong partner's pension for spouse \\- see section 8 of the [Pension Scheme](https://drive.google.com/file/d/1FaC8sHe-r_PHz4xrXbNYlH2zCHAU972h/view?usp=sharing)\r\n* Temporary dependent's pension for children\r\n* The beneficiary is also entitled to an additional partner's pension that is bought by the invested pension capital upon death \\- see section 18 of the [Pension Scheme](https://drive.google.com/file/d/1FaC8sHe-r_PHz4xrXbNYlH2zCHAU972h/view?usp=sharing)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Pension Scheme", "target_url": "https://drive.google.com/file/d/1FaC8sHe-r_PHz4xrXbNYlH2zCHAU972h/view?usp=sharing", "line_number": 270}, {"anchor_text": "Pension Scheme", "target_url": "https://drive.google.com/file/d/1FaC8sHe-r_PHz4xrXbNYlH2zCHAU972h/view?usp=sharing", "line_number": 272}]}, "SEC_NL_35": {"section_id": "SEC_NL_35", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs"], "disclosure_title": null, "line_start": 276, "line_end": 276, "raw_text": "## Additional Benefits and Programs\r\n", "outgoing_links": []}, "SEC_NL_36": {"section_id": "SEC_NL_36", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs", "30% Tax Ruling"], "disclosure_title": null, "line_start": 278, "line_end": 280, "raw_text": "### 30% Tax Ruling\r\n\r\nEligible team members may apply for tax advantages under the 30% ruling.\r\n", "outgoing_links": []}, "SEC_NL_37": {"section_id": "SEC_NL_37", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs", "30% Tax Ruling"], "disclosure_title": "How to Access", "line_start": 282, "line_end": 290, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n* Review eligibility on our [Visas page](/handbook/people-group/visas/#30-ruling-in-the-netherlands)\r\n* [Expense reimbursement available](/handbook/people-group/visas/#expensing)\r\n* Contact: [payroll@savvy-group.eu](mailto:payroll@savvy-group.eu) (copy [nonuspayroll@gitlab.com](mailto:nonuspayroll@gitlab.com))\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Visas page", "target_url": "/handbook/people-group/visas/#30-ruling-in-the-netherlands", "line_number": 286}, {"anchor_text": "Expense reimbursement available", "target_url": "/handbook/people-group/visas/#expensing", "line_number": 287}, {"anchor_text": "payroll@savvy-group.eu", "target_url": "mailto:payroll@savvy-group.eu", "line_number": 288}, {"anchor_text": "nonuspayroll@gitlab.com", "target_url": "mailto:nonuspayroll@gitlab.com", "line_number": 288}]}, "SEC_NL_38": {"section_id": "SEC_NL_38", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs", "Bike to Work Scheme"], "disclosure_title": null, "line_start": 292, "line_end": 294, "raw_text": "### Bike to Work Scheme\r\n\r\nTax-advantaged bicycle purchase program to support sustainable commuting.\r\n", "outgoing_links": []}, "SEC_NL_39": {"section_id": "SEC_NL_39", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs", "Bike to Work Scheme"], "disclosure_title": "Key Features", "line_start": 296, "line_end": 305, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eKey Features\u003c/summary\u003e\r\n\r\n* Up to EUR 2,000 for bike purchase\r\n* Available every 2 years\r\n* Tax benefit on purchase\r\n* Can include accessories\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_40": {"section_id": "SEC_NL_40", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs", "Bike to Work Scheme"], "disclosure_title": "How to Access", "line_start": 307, "line_end": 315, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n1. Email [payroll@savvy-group.eu](mailto:payroll@savvy-group.eu) with bike choice\r\n2. HR Savvy prepares contract addendum\r\n3. Cost deducted from gross salary for tax benefit\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "payroll@savvy-group.eu", "target_url": "mailto:payroll@savvy-group.eu", "line_number": 311}]}, "SEC_NL_41": {"section_id": "SEC_NL_41", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs", "Bike to Work Scheme"], "disclosure_title": "Important Details", "line_start": 317, "line_end": 324, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eImportant Details\u003c/summary\u003e\r\n\r\n* For bikes over EUR 2,000, difference deducted from net salary\r\n* Tax benefit only applies to first EUR 2,000\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_42": {"section_id": "SEC_NL_42", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs", "Internet Support"], "disclosure_title": null, "line_start": 326, "line_end": 328, "raw_text": "### Internet Support\r\n\r\nSupport for your home internet costs as part of our remote work setup.\r\n", "outgoing_links": []}, "SEC_NL_43": {"section_id": "SEC_NL_43", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Additional Benefits and Programs", "Internet Support"], "disclosure_title": "How to Access", "line_start": 330, "line_end": 336, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n* See [Global Travel and Expense Policy \\- Internet section](https://internal.gitlab.com/handbook/finance/expenses/#internet)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Global Travel and Expense Policy \\- Internet section", "target_url": "https://internal.gitlab.com/handbook/finance/expenses/#internet", "line_number": 334}]}, "SEC_NL_44": {"section_id": "SEC_NL_44", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves"], "disclosure_title": null, "line_start": 338, "line_end": 338, "raw_text": "## Growing Families Leaves\r\n", "outgoing_links": []}, "SEC_NL_45": {"section_id": "SEC_NL_45", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Statutory Maternity Leave"], "disclosure_title": null, "line_start": 340, "line_end": 342, "raw_text": "### Statutory Maternity Leave\r\n\r\n16 weeks of fully paid leave to welcome your new child, with flexibility in how you use it.\r\n", "outgoing_links": []}, "SEC_NL_46": {"section_id": "SEC_NL_46", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Statutory Maternity Leave"], "disclosure_title": "Leave Entitlement", "line_start": 344, "line_end": 354, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n* Up to 6 weeks before estimated birth date\r\n* 10 weeks after birth\r\n* Can reduce pre-birth leave to minimum 4 weeks and add unused days after birth\r\n* 100% salary continuation (GitLab tops up [UWV benefit](https://www.uwv.nl/en/about-uwv/executive-board))\r\n* The statutory leave will run concurrently with [GitLab Parental Leave](/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "UWV benefit", "target_url": "https://www.uwv.nl/en/about-uwv/executive-board", "line_number": 351}, {"anchor_text": "GitLab Parental Leave", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave", "line_number": 352}]}, "SEC_NL_47": {"section_id": "SEC_NL_47", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Statutory Maternity Leave"], "disclosure_title": "How to Access", "line_start": 356, "line_end": 365, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n* Email [leaves@gitlab.com](mailto:leaves@gitlab.com) with your desired start date\r\n* Can start 6 weeks before, but no later than 4 weeks before due date\r\n* HR Savvy handles UWV application on your behalf\r\n* The benefit is always directly paid to Gitlab so that there is once source of pay”\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "leaves@gitlab.com", "target_url": "mailto:leaves@gitlab.com", "line_number": 360}]}, "SEC_NL_48": {"section_id": "SEC_NL_48", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Statutory Maternity Leave"], "disclosure_title": "Important Details", "line_start": 367, "line_end": 374, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eImportant Details\u003c/summary\u003e\r\n\r\n* If unable to work from 6 weeks before due date, leave automatically begins\r\n* Runs concurrently with GitLab parental leave if eligible\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_49": {"section_id": "SEC_NL_49", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Statutory Partner/Paternity Leave"], "disclosure_title": null, "line_start": 376, "line_end": 378, "raw_text": "### Statutory Partner/Paternity Leave\r\n\r\nTime to bond with your new child and support your partner.\r\n", "outgoing_links": []}, "SEC_NL_50": {"section_id": "SEC_NL_50", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Statutory Partner/Paternity Leave"], "disclosure_title": "Leave Entitlement", "line_start": 380, "line_end": 386, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n* 5 days paid Birth Leave (100% salary), to be used within 4 weeks of birth\r\n* 5 weeks paid Additional Birth Leave within 6 months (at 70% of maximum day wage)\r\n* Review [company policy](/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave) as when more beneficial they supersede the statutory leave benefits\r\n", "outgoing_links": [{"anchor_text": "company policy", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave", "line_number": 386}]}, "SEC_NL_51": {"section_id": "SEC_NL_51", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Statutory Partner/Paternity Leave"], "disclosure_title": "How to Access", "line_start": 388, "line_end": 395, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n1. Email [leaves@gitlab.com](mailto:leaves@gitlab.com) with your desired dates\r\n1. Request the additional 5 weeks at least 4 weeks in advance\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "leaves@gitlab.com", "target_url": "mailto:leaves@gitlab.com", "line_number": 392}]}, "SEC_NL_52": {"section_id": "SEC_NL_52", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Adoption and Foster Care Leave"], "disclosure_title": null, "line_start": 397, "line_end": 399, "raw_text": "### Adoption and Foster Care Leave\r\n\r\n6 weeks of leave with adoption/foster care allowance for welcoming a child into your family.\r\n", "outgoing_links": []}, "SEC_NL_53": {"section_id": "SEC_NL_53", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Adoption and Foster Care Leave"], "disclosure_title": "Leave Entitlement", "line_start": 401, "line_end": 409, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n* GitLab supplements allowance to ensure 100% pay for first 16 weeks\r\n* Additional 9 weeks partial payment available for children under 8 (effective 2022-08-02)\r\n* Must be within child's first year after adoption/placement\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_54": {"section_id": "SEC_NL_54", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Adoption and Foster Care Leave"], "disclosure_title": "How to Access", "line_start": 411, "line_end": 418, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n* Notify [leaves@gitlab.com](mailto:leaves@gitlab.com) at least 3 weeks in advance\r\n* Designate as \"Parental Leave\" in Workday\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "leaves@gitlab.com", "target_url": "mailto:leaves@gitlab.com", "line_number": 415}]}, "SEC_NL_55": {"section_id": "SEC_NL_55", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Parental Leave Options"], "disclosure_title": null, "line_start": 420, "line_end": 422, "raw_text": "### Parental Leave Options\r\n\r\nExtended unpaid leave available for parents of children 8 years or younger.\r\n", "outgoing_links": []}, "SEC_NL_56": {"section_id": "SEC_NL_56", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Parental Leave Options"], "disclosure_title": "Leave Entitlement", "line_start": 424, "line_end": 434, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n* Up to 26 times your weekly work hours\r\n* Partial payment (70% of daily wage) for up to 9 weeks within child's first year\r\n* Must be used before the child turns 8 years old\r\n* The parental leave entitlement is per child\r\n* GitLab applies for UWV benefit on your behalf\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_57": {"section_id": "SEC_NL_57", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Short-Term Care Leave"], "disclosure_title": null, "line_start": 436, "line_end": 438, "raw_text": "### Short-Term Care Leave\r\n\r\nTime off when family members or others close to you need essential care.\r\n", "outgoing_links": []}, "SEC_NL_58": {"section_id": "SEC_NL_58", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Short-Term Care Leave"], "disclosure_title": "Eligibility", "line_start": 440, "line_end": 447, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eEligibility\u003c/summary\u003e\r\n\r\n* Must be only person available to provide care\r\n* Covers: children, foster children, spouse/partner, parents, grandparents, siblings, others with social relationship\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_59": {"section_id": "SEC_NL_59", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Short-Term Care Leave"], "disclosure_title": "Leave Entitlement", "line_start": 449, "line_end": 456, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n* Up to 2x your weekly hours per year (e.g., 80 hours for full-time)\r\n* 100% pay for first 25 days (then 70% statutory rate)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_60": {"section_id": "SEC_NL_60", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Short-Term Care Leave"], "disclosure_title": "How to Access", "line_start": 458, "line_end": 464, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n* Notify manager and [leaves@gitlab.com](mailto:leaves@gitlab.com) as soon as possible\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "leaves@gitlab.com", "target_url": "mailto:leaves@gitlab.com", "line_number": 462}]}, "SEC_NL_61": {"section_id": "SEC_NL_61", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Long-Term Care Leave"], "disclosure_title": null, "line_start": 466, "line_end": 468, "raw_text": "### Long-Term Care Leave\r\n\r\nExtended leave for serious, life-threatening illness of child, partner, or parent.\r\n", "outgoing_links": []}, "SEC_NL_62": {"section_id": "SEC_NL_62", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Long-Term Care Leave"], "disclosure_title": "Leave Entitlement", "line_start": 470, "line_end": 477, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n* Up to 6x your weekly hours per year (e.g., 240 hours for full-time)\r\n* Unpaid, but runs concurrently with PTO (100% pay for first 25 days)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_63": {"section_id": "SEC_NL_63", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Growing Families Leaves", "Long-Term Care Leave"], "disclosure_title": "How to Access", "line_start": 479, "line_end": 485, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n* Notify manager and [leaves@gitlab.com](mailto:leaves@gitlab.com) as soon as possible\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "leaves@gitlab.com", "target_url": "mailto:leaves@gitlab.com", "line_number": 483}]}, "SEC_NL_64": {"section_id": "SEC_NL_64", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Time Off Policies"], "disclosure_title": null, "line_start": 487, "line_end": 487, "raw_text": "## Time Off Policies\r\n", "outgoing_links": []}, "SEC_NL_65": {"section_id": "SEC_NL_65", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Time Off Policies", "Sick Leave Support"], "disclosure_title": null, "line_start": 489, "line_end": 491, "raw_text": "### Sick Leave Support\r\n\r\nComprehensive coverage when you're unable to work due to illness.\r\n", "outgoing_links": []}, "SEC_NL_66": {"section_id": "SEC_NL_66", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Time Off Policies", "Sick Leave Support"], "disclosure_title": "Leave Entitlement", "line_start": 493, "line_end": 501, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\\\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n* 100% salary for first 25 days\r\n* 70% salary continuation for up to 104 weeks total\r\n* GitLab complies with [Dutch local laws](https://business.gov.nl/regulation/reporting-employee-illness-recovery/) regarding sick leave. Local laws override any leave policy we have in the benefit of the team members\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Dutch local laws", "target_url": "https://business.gov.nl/regulation/reporting-employee-illness-recovery/", "line_number": 499}]}, "SEC_NL_67": {"section_id": "SEC_NL_67", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Time Off Policies", "Sick Leave Support"], "disclosure_title": "How to Report", "line_start": 503, "line_end": 521, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Report\u003c/summary\u003e\r\n\r\n* Select \"Out Sick\" in Workday\r\n\r\nEmployees of GitLab B.V. have further rights and responsibilities regarding sick time based on Dutch law, as written into their employment [contracts](https://internal.gitlab.com/handbook/people-group/people-operations/people-operations/employment_contracts/):\r\n\r\n* Team members must notify their manager of any sick leave needed.\r\n* Team members must then enter the sick time via Workday as aligned above.\r\n* If the sick leave extends 8 days it should be reported to the Absence Management team via leaves@gitlab.com by the Manager and team member (if able).\r\n* If team members are reporting multiple instances of sick leave in a 28 day timeframe, if this happens, it will be considered the same sickness. Please reach out to the Absence Management team.\r\n* Once the Absence Management team has been notified of the sick time they will inform HRSavvy.\r\n* HRSavvy will be registering the sick time in their HR portal from the first day of absence (retrospectively).\r\n* GitLab has engaged with an occupational health and safety centre, called Leuk Personeel, to assist employees of GitLab B.V. who may need support while being on long-term sick leave.\r\n* If the team members is on long-term sick leave (8 days of more), the Absence Management team will instruct HRSavvy to register the team member at the occupational health and safety service, depending on the situation and agreement with the team member.\r\n* Team members are expected to be available and follow the applicable Act (Gatekeeper Act) and internal policy.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "contracts", "target_url": "https://internal.gitlab.com/handbook/people-group/people-operations/people-operations/employment_contracts/", "line_number": 509}]}, "SEC_NL_68": {"section_id": "SEC_NL_68", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Time Off Policies", "Vacation Time"], "disclosure_title": null, "line_start": 523, "line_end": 525, "raw_text": "### Vacation Time\r\n\r\nGuaranteed time to rest and recharge throughout the year.\r\n", "outgoing_links": []}, "SEC_NL_69": {"section_id": "SEC_NL_69", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Time Off Policies", "Vacation Time"], "disclosure_title": "Leave Entitlement", "line_start": 527, "line_end": 536, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n* Minimum 20 vacation days annually as per the [statutory requirements](/handbook/people-group/time-off-and-absence/time-off-types/)  \r\n* Accrue at 1.67 days/month from start date\r\n* Unused days carry over to the next calendar year but expire July 1st\r\n* Pro-rated for partial years\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "statutory requirements", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/", "line_number": 531}]}, "SEC_NL_70": {"section_id": "SEC_NL_70", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Time Off Policies", "Vacation Time"], "disclosure_title": "How to Track", "line_start": 538, "line_end": 544, "raw_text": "\u003cdetails markdown=\"1\"\\\u003e\r\n\r\n\u003csummary\u003eHow to Track\u003c/summary\u003e\r\n\r\nDesignate all vacation as \"Paid Time Off\" in Workday\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_NL_71": {"section_id": "SEC_NL_71", "source_file": "bv-benefits-netherlands.md", "source_sha256": "f402d4728e8f25faba255f918664898f1f0ffc49dc8edc5d04b66197a39e0e68", "heading_path": ["GitLab BV (Netherlands) Benefits", "Questions?"], "disclosure_title": null, "line_start": 546, "line_end": 552, "raw_text": "## Questions?\r\n\r\nFor any questions about your benefits, reach out to our support teams:\r\n\r\n* Benefits: [Compass](https://app.serval.com/new-request)\r\n* Leave of absence: [leaves@gitlab.com](mailto:leaves@gitlab.com)\r\n* Payroll and administrative questions: [payroll@savvy-group.eu](mailto:payroll@savvy-group.eu)\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 550}, {"anchor_text": "leaves@gitlab.com", "target_url": "mailto:leaves@gitlab.com", "line_number": 551}, {"anchor_text": "payroll@savvy-group.eu", "target_url": "mailto:payroll@savvy-group.eu", "line_number": 552}]}, "SEC_GLOBAL_01": {"section_id": "SEC_GLOBAL_01", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "How Our Benefits Work"], "disclosure_title": null, "line_start": 7, "line_end": 13, "raw_text": "## How Our Benefits Work\r\n\r\n**Company-Wide Benefits** are available to all GitLab team members worldwide, regardless of location (unless otherwise stated).\r\n\r\n**Entity-Specific Benefits** are additional benefits available to team members in countries where GitLab has established entities or uses Professional Employer Organizations (PEOs).\r\n\r\n**Questions?** Contact our team at [Compass](https://app.serval.com/new-request) for any benefits-related questions.\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 13}]}, "SEC_GLOBAL_02": {"section_id": "SEC_GLOBAL_02", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Entity-Specific Benefits"], "disclosure_title": null, "line_start": 15, "line_end": 29, "raw_text": "## Entity-Specific Benefits\r\n\r\nAdditional benefits are available based on your employment location. Select your entity below for detailed information:\r\n\r\n| EMEA  | Americas | APAC | Global Partners |\r\n|------|-----------|----------|----------|\r\n| [GitLab BV (Netherlands)](/handbook/total-rewards/benefits/general-and-entity-benefits/bv-benefits-netherlands/) | [GitLab Inc and GitLab Fed (US)](/handbook/total-rewards/benefits/gener ndbook/entity/gmbh-germany/", "line_number": 25}, {"anchor_text": "GitLab India Private Limited", "target_url": "/handbook/entity/india-pvt-ltd/", "line_number": 25}, {"anchor_text": "GitLab Ireland LTD", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/gitlab-ireland-ltd/", "line_number": 26}, {"anchor_text": "GitLab PTY New Zealand", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/pty-benefits-new-zealand/", "line_number": 26}, {"anchor_text": "GitLab France S.A.S.", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/france-sas/", "line_number": 27}, {"anchor_text": "GitLab Iberia s.r.l Spain", "target_url": "/handbook/entity/iberia-srl-spain/", "line_number": 28}, {"anchor_text": "Gitlab Israel LTD", "target_url": "/handbook/entity/israel-ltd/", "line_number": 29}]}, "SEC_GLOBAL_03": {"section_id": "SEC_GLOBAL_03", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members"], "disclosure_title": null, "line_start": 31, "line_end": 31, "raw_text": "## Company Wide Benefits - Available to All Team Members\r\n", "outgoing_links": []}, "SEC_GLOBAL_04": {"section_id": "SEC_GLOBAL_04", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Health \u0026 Wellness"], "disclosure_title": null, "line_start": 33, "line_end": 33, "raw_text": "### Health \u0026 Wellness\r\n", "outgoing_links": []}, "SEC_GLOBAL_05": {"section_id": "SEC_GLOBAL_05", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Health \u0026 Wellness", "Modern Health - Mental Health Support"], "disclosure_title": null, "line_start": 35, "line_end": 37, "raw_text": "#### Modern Health - Mental Health Support\r\n\r\nMental health support that's there when you need it most. Our comprehensive program offers therapy sessions with licensed professionals, career and personal coaching, and wellness resources designed to support your wellbeing through all of life's ups and downs.\r\n", "outgoing_links": []}, "SEC_GLOBAL_06": {"section_id": "SEC_GLOBAL_06", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Health \u0026 Wellness", "Modern Health - Mental Health Support"], "disclosure_title": "Modern Health Details", "line_start": 39, "line_end": 55, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eModern Health Details\u003c/summary\u003e\r\n\r\n**Coverage:** Available to all team members and their dependents worldwide\r\n\r\n**Key Features:**\r\n\r\n- See everything Modern Health offers on the [Modern Health Handbook page](/handbook/total-rewards/benefits/modern-health/)\r\n- One-on-one therapy sessions with licensed therapists\r\n- Professional coaching for personal and career development\r\n- Self-guided courses and wellness resources\r\n- Family support including dependent coverage\r\n- Available in multiple languages\r\n\r\n**How to Access:** Register using the [step-by-step instructions](/handbook/total-rewards/benefits/modern-health/) on the Modern Health handbook page\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Modern Health Handbook page", "target_url": "/handbook/total-rewards/benefits/modern-health/", "line_number": 46}, {"anchor_text": "step-by-step instructions", "target_url": "/handbook/total-rewards/benefits/modern-health/", "line_number": 53}]}, "SEC_GLOBAL_07": {"section_id": "SEC_GLOBAL_07", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Health \u0026 Wellness", "HealthKick Well-being Platform"], "disclosure_title": null, "line_start": 57, "line_end": 59, "raw_text": "#### HealthKick Well-being Platform\r\n\r\nWellness support that fits your lifestyle and budget. Our [global wellness platform](https://drive.google.com/file/d/1AitsrkUDA66UV5xZsv5ooqxmr7BpxlLh/view) connects you with discounts and resources across fitness, nutrition, and wellness services, making it easier to prioritize your health no matter where life takes you.\r\n", "outgoing_links": [{"anchor_text": "global wellness platform", "target_url": "https://drive.google.com/file/d/1AitsrkUDA66UV5xZsv5ooqxmr7BpxlLh/view", "line_number": 59}]}, "SEC_GLOBAL_08": {"section_id": "SEC_GLOBAL_08", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Health \u0026 Wellness", "HealthKick Well-being Platform"], "disclosure_title": "Healthkick Well-Being Platform Details", "line_start": 61, "line_end": 79, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHealthkick Well-Being Platform Details\u003c/summary\u003e\r\n\r\n**Coverage:** Available to all team members worldwide\r\n\r\n**Key Features:**\r\n\r\n- Access to 250+ brands and expert resources\r\n- Fitness classes and personalized workout plans\r\n- Nutrition workshops and mental health resources\r\n- No cost to team members\r\n\r\n**How to Access:** Use the GitLab [self-registration link](https://www.health-kick.com/companies/1004/registration) and review the [HealthKick Welcome Packet](https://drive.google.com/file/d/1_vdASrSSzztvEwM7NOx_szEPYMkPBiiA/view?usp=sharing)\r\n\r\n**Questions?** Contact HealthKick support at [concierge@health-kick.com](mailto:concierge@health-kick.com)\r\n\r\n**Note:** If you haven't used your HealthKick account in over 6 months, you may need to reactivate it when you log back in. Contact the concierge team at [concierge@health-kick.com](mailto:concierge@health-kick.com) and they'll help you get access again.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "self-registration link", "target_url": "https://www.health-kick.com/companies/1004/registration", "line_number": 73}, {"anchor_text": "HealthKick Welcome Packet", "target_url": "https://drive.google.com/file/d/1_vdASrSSzztvEwM7NOx_szEPYMkPBiiA/view?usp=sharing", "line_number": 73}, {"anchor_text": "concierge@health-kick.com", "target_url": "mailto:concierge@health-kick.com", "line_number": 75}, {"anchor_text": "concierge@health-kick.com", "target_url": "mailto:concierge@health-kick.com", "line_number": 77}]}, "SEC_GLOBAL_09": {"section_id": "SEC_GLOBAL_09", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Family Benefits"], "disclosure_title": null, "line_start": 81, "line_end": 81, "raw_text": "### Family Benefits\r\n", "outgoing_links": []}, "SEC_GLOBAL_10": {"section_id": "SEC_GLOBAL_10", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Family Benefits", "Vivvi Caregiving Benefits"], "disclosure_title": null, "line_start": 83, "line_end": 85, "raw_text": "#### Vivvi Caregiving Benefits\r\n\r\nReliable backup care and tutoring services designed to support your family when you need it most. Whether it's unexpected childcare needs, educational support for your kids, or elder care assistance, these benefits help reduce stress and keep your family covered.\r\n", "outgoing_links": []}, "SEC_GLOBAL_11": {"section_id": "SEC_GLOBAL_11", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Family Benefits", "Vivvi Caregiving Benefits"], "disclosure_title": "Vivvi Caregiving Benefit Key Details", "line_start": 87, "line_end": 103, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eVivvi Caregiving Benefit Key Details\u003c/summary\u003e\r\n\r\n**Benefit Options:**\r\n\r\n- Care Cash: Reimbursement for backup care\r\n- Virtual Tutoring: Weekly 1-hour sessions for ages 5-18\r\n- Center-based and in-home backup childcare (US, Canada, UK)\r\n- In-home backup adult and elder care (US, Canada, UK)\r\n\r\nMore information on the program can be found on the [Vivvi FAQ](https://drive.google.com/file/d/1oU7Kzpcj8hrVJkCo6McAgDpktrVWqeTh/view?usp=sharing) and in the [Vivvi webinar recording.](https://drive.google.com/file/d/1g7SugxmyV4kggCuVomtdfjRFZyliiCCO/view)\r\n\r\n**How to Enroll:** [Click here](https://share.hsforms.com/1gj0LdnKCQ1-GXyLsGmFDjg47d19) to sign up and activate your benefits\r\n\r\n**Important:** This benefit is considered taxable income. To ensure compliance, any usage of the benefit will be reported, and applicable taxes will be deducted through payroll.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Vivvi FAQ", "target_url": "https://drive.google.com/file/d/1oU7Kzpcj8hrVJkCo6McAgDpktrVWqeTh/view?usp=sharing", "line_number": 97}, {"anchor_text": "Vivvi webinar recording.", "target_url": "https://drive.google.com/file/d/1g7SugxmyV4kggCuVomtdfjRFZyliiCCO/view", "line_number": 97}, {"anchor_text": "Click here", "target_url": "https://share.hsforms.com/1gj0LdnKCQ1-GXyLsGmFDjg47d19", "line_number": 99}]}, "SEC_GLOBAL_12": {"section_id": "SEC_GLOBAL_12", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Family Benefits", "Parental Leave"], "disclosure_title": null, "line_start": 105, "line_end": 107, "raw_text": "#### Parental Leave\r\n\r\nComprehensive parental leave to support you during one of life's most important transitions. Whether you're welcoming a child through birth or adoption, you'll have 16 weeks of paid leave to bond with your new family member, adjust to your new role as a parent, and focus on what matters most during this time.\r\n", "outgoing_links": []}, "SEC_GLOBAL_13": {"section_id": "SEC_GLOBAL_13", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Family Benefits", "Parental Leave"], "disclosure_title": "Parental Leave Key Details", "line_start": 109, "line_end": 128, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eParental Leave Key Details\u003c/summary\u003e\r\n\r\n**Key Features:**\r\n\r\n- Available from your first day of work\r\n- Use within child's first birthday or first anniversary of adoption\r\n- Flexible scheduling - take all at once or split into up to three segments\r\n- Runs concurrently with statutory benefits where applicable\r\n- Access to [Parentaly](/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave-support-parentaly) to help with coverage planning, transitioning work, and supporting your career through parental leave\r\n\r\n**Returning to Work:**\r\n\r\n- 50% capacity option available for 2-4 weeks (discuss with your manager)\r\n- Access to [Parentaly](/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave-support-parentaly) support for return to work coaching\r\n- Support through #intheparenthood Slack channel\r\n\r\nFor complete details on parental leave planning, how to apply, commission policies during leave, and resources for returning to work, please see the full [Parental Leave policy handbook page](/handbook/people-group/time-off-and-absence/leave-types/#gitlab-parental-leave).\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Parentaly", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave-support-parentaly", "line_number": 118}, {"anchor_text": "Parentaly", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave-support-parentaly", "line_number": 123}, {"anchor_text": "Parental Leave policy handbook page", "target_url": "/handbook/people-group/time-off-and-absence/leave-types/#gitlab-parental-leave", "line_number": 126}]}, "SEC_GLOBAL_14": {"section_id": "SEC_GLOBAL_14", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Family Benefits", "Parental Leave Support: Parentaly"], "disclosure_title": null, "line_start": 130, "line_end": 132, "raw_text": "#### Parental Leave Support: Parentaly\r\n\r\nParentaly helps you build a strong coverage plan, transition work effectively, and return to work with confidence. You’ll gain access to templates, a personalized toolkit and materials, plus 3-9 sessions with a dedicated Parentaly Expert (before and after your leave) who has supported hundreds of others through parental leave. Sign up instructions are outlined below.\r\n", "outgoing_links": []}, "SEC_GLOBAL_15": {"section_id": "SEC_GLOBAL_15", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Family Benefits", "Parental Leave Support: Parentaly"], "disclosure_title": "Program Details", "line_start": 134, "line_end": 150, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eProgram Details\u003c/summary\u003e\r\n\r\n- Open to all team members taking parental leave globally, regardless of gender or method (adoption, surrogacy, birthing, partner giving birth)\r\n- Participants should sign up 2-3 months before starting their parental leave (though you can also join while already on leave or early upon your return)\r\n- You’ll be matched with a Parentaly Expert and all your conversations and work will be confidential\r\n- You’ll also receive a personalized checklist to build your coverage plan quickly and effectively - setting you and your team up for success\r\n- Upon return, your Parentaly Expert will help you navigate whatever challenges or priorities are top of mind - whether that is ramping back up, pursuing a promotion, getting to know a new manager, or anything else that comes up in this transition\r\n- The program cost is funded under the [Growth and Development Fund](/handbook/total-rewards/benefits/general-and-entity-benefits/#growth-and-development-fund). More specific information about the sign-up process and funding can be found in th G\u0026D handbook apge [here](/handbook/people-group/learning-and-development/growth-and-development/)\r\n- Questions about the program? Email Parentaly at info@parentaly.com\r\n\r\n**How to sign up:**\r\n\r\n1. Learn how the program is funded [here](/handbook/people-group/learning-and-development/growth-and-development/#parentaly), then, open a Parentaly G\u0026D request in Compass.\r\n1. [Click here to sign up](https://www.parentaly.com/join/coaching-program/gitlab) - your name will be shared with the Benefits team for invoicing purposes, but all other details will be confidential.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Growth and Development Fund", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#growth-and-development-fund", "line_number": 142}, {"anchor_text": "here", "target_url": "/handbook/people-group/learning-and-development/growth-and-development/", "line_number": 142}, {"anchor_text": "here", "target_url": "/handbook/people-group/learning-and-development/growth-and-development/#parentaly", "line_number": 147}, {"anchor_text": "Click here to sign up", "target_url": "https://www.parentaly.com/join/coaching-program/gitlab", "line_number": 148}]}, "SEC_GLOBAL_16": {"section_id": "SEC_GLOBAL_16", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Family Benefits", "Fertility \u0026 Family Planning"], "disclosure_title": null, "line_start": 152, "line_end": 156, "raw_text": "#### Fertility \u0026 Family Planning\r\n\r\nTeam Members can refer to their [entity-specific](/handbook/total-rewards/benefits/general-and-entity-benefits/#entity-specific-benefits) medical plans to understand the fertility and family planning benefits available to them, as applicable. Please contact [Compass](https://app.serval.com/new-request) should you have any questions.\r\n\r\nGitLab plans to continue to iterate on fertility benefits as we evaluate and enhance our overall benefit plans. In a future state, GitLab aims to expand fertility and family planning services (including adoption support) in order to help our team members grow their families.\r\n", "outgoing_links": [{"anchor_text": "entity-specific", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#entity-specific-benefits", "line_number": 154}, {"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 154}]}, "SEC_GLOBAL_17": {"section_id": "SEC_GLOBAL_17", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth"], "disclosure_title": null, "line_start": 158, "line_end": 158, "raw_text": "### Financial Security \u0026 Professional Growth\r\n", "outgoing_links": []}, "SEC_GLOBAL_18": {"section_id": "SEC_GLOBAL_18", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Equity Compensation"], "disclosure_title": null, "line_start": 160, "line_end": 162, "raw_text": "#### Equity Compensation\r\n\r\n[Equity Compensation](/handbook/total-rewards/stock-options/) is offered to most GitLab team members. We strongly believe in team member ownership in our Company. We are in business to create value for our shareholders and we want our team members to benefit from that shared success.\r\n", "outgoing_links": [{"anchor_text": "Equity Compensation", "target_url": "/handbook/total-rewards/stock-options/", "line_number": 162}]}, "SEC_GLOBAL_19": {"section_id": "SEC_GLOBAL_19", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Incentives: Discretionary Performance \u0026 Referral Bonuses"], "disclosure_title": null, "line_start": 164, "line_end": 169, "raw_text": "#### Incentives: Discretionary Performance \u0026 Referral Bonuses\r\n\r\nPerformance and referral incentive programs that recognize your contributions and help us build our team together.\r\n\r\n- [Discretionary Bonuses](/handbook/total-rewards/incentives/#discretionary-bonuses)\r\n- [Referral Bonuses](/handbook/total-rewards/incentives/#referral-bonuses)\r\n", "outgoing_links": [{"anchor_text": "Discretionary Bonuses", "target_url": "/handbook/total-rewards/incentives/#discretionary-bonuses", "line_number": 168}, {"anchor_text": "Referral Bonuses", "target_url": "/handbook/total-rewards/incentives/#referral-bonuses", "line_number": 169}]}, "SEC_GLOBAL_20": {"section_id": "SEC_GLOBAL_20", "source_file": "general-and-entity-benefits__index.md", "source_sha256": "d5760f13f8451ea617e4abc6eecc5ee032687b1a3ac176f9996ed008ce19cfb1", "heading_path": ["General \u0026 Entity Specific Benefits \u0026 Information", "Company Wide Benefits - Available to All Team Members", "Financial Security \u0026 Professional Growth", "Life Insurance Coverage"], "disclosure_title": null, "line_start": 171, "line_end": 173, "raw_text": "#### Life Insurance Coverage\r\n\r\nWe want you to have peace of mind knowing your loved ones are protected. Where local life insurance benefits aren't available, GitLab provides $20,000 in life insurance coverage that you can direct to
