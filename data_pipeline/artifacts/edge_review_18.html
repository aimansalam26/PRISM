rollment upon hire\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_19": {"section_id": "SEC_UK_19", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Life Insurance"], "disclosure_title": "Coverage \u0026 Key Features", "line_start": 166, "line_end": 175, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eCoverage \u0026 Key Features\u003c/summary\u003e\r\n\r\n- The automatic cover threshold for the Group Life Insurance policy is 4x base salary.\r\n- Underwriting: Based on the current non-medical limit of £1,800,000, the salary threshold above which medical underwriting is required is £450,000 (i.e., £1,800,000 ÷ 4).\r\n- Tax-free benefit payment\r\n- Includes Cancer Assist support through Reframe\r\n- View the [Life Insurance Policy Guide](https://drive.google.com/file/d/1D7QXKKvVtafQFbBFD4mPuKqbi1mqBsLh/view?usp=sharing)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Life Insurance Policy Guide", "target_url": "https://drive.google.com/file/d/1D7QXKKvVtafQFbBFD4mPuKqbi1mqBsLh/view?usp=sharing", "line_number": 173}]}, "SEC_UK_20": {"section_id": "SEC_UK_20", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Life Insurance"], "disclosure_title": "How to Access", "line_start": 177, "line_end": 184, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n- Automatically enrolled—no action needed\r\n- Designate beneficiaries using the [Expression of Wishes Form](https://drive.google.com/file/d/1m68nqgQyZvuY7VoJPo1to5XDpecduJ2y/view?usp=sharing)\r\n- Upload completed form to Workday under \"Benefit Documents and Forms\"\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Expression of Wishes Form", "target_url": "https://drive.google.com/file/d/1m68nqgQyZvuY7VoJPo1to5XDpecduJ2y/view?usp=sharing", "line_number": 181}]}, "SEC_UK_21": {"section_id": "SEC_UK_21", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Life Insurance"], "disclosure_title": "Medical Underwriting", "line_start": 186, "line_end": 192, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eMedical Underwriting\u003c/summary\u003e\r\n\r\n- Salaries above £450,000 require medical assessment for additional coverage\r\n- Contact total-rewards@gitlab.com if you need coverage above the automatic limit\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_22": {"section_id": "SEC_UK_22", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Income Protection"], "disclosure_title": null, "line_start": 194, "line_end": 196, "raw_text": "### Income Protection\r\n\r\nProvides 66% of your base salary if you cannot work due to illness or injury, plus vocational rehabilitation support.\r\n", "outgoing_links": []}, "SEC_UK_23": {"section_id": "SEC_UK_23", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Income Protection"], "disclosure_title": "Eligibility Requirements", "line_start": 198, "line_end": 205, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eEligibility Requirements\u003c/summary\u003e\r\n\r\n- All team members aged 16 to State Pension Age\r\n- After State Pension Age, team members are enrolled in an Extended Cover Policy up to age 70.\r\n- Automatic enrollment upon hire\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_24": {"section_id": "SEC_UK_24", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Income Protection"], "disclosure_title": "Coverage \u0026 Key Features", "line_start": 207, "line_end": 215, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eCoverage \u0026 Key Features\u003c/summary\u003e\r\n\r\n- 66% of base salary after 13 weeks absence\r\n- Vocational rehabilitation consultants to support your return to work\r\n- Holistic wellbeing and absence management services\r\n- View the [Unum Employee Guide to Claims](https://www.unum.co.uk/claims/group-income-protection/employee-guide-to-claims)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Unum Employee Guide to Claims", "target_url": "https://www.unum.co.uk/claims/group-income-protection/employee-guide-to-claims", "line_number": 213}]}, "SEC_UK_25": {"section_id": "SEC_UK_25", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Income Protection"], "disclosure_title": "How to Access", "line_start": 217, "line_end": 224, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n- The Leaves team will reach out at week 6 of absence to initiate the claim process\r\n- If you have questions before then, contact the Leaves team via [Compass](https://app.serval.com/new-request)\r\n- Payments made like regular salary with standard tax deductions\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 221}]}, "SEC_UK_26": {"section_id": "SEC_UK_26", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Income Protection"], "disclosure_title": "Medical Underwriting", "line_start": 226, "line_end": 233, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eMedical Underwriting\u003c/summary\u003e\r\n\r\n- The automatic cover threshold for the Group Income Protection policy is 66.6% of salary.\r\n- Underwriting: Based on the current non-medical limit of £155,000, the base salary threshold above which medical underwriting is required is £232,732 (i.e., £155,000 ÷ 66.6%).\r\n- Higher salaries require medical assessment for additional coverage\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_27": {"section_id": "SEC_UK_27", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": null, "line_start": 235, "line_end": 237, "raw_text": "### Pension Scheme\r\n\r\nGitLab provides a Group Personal Pension Plan with Scottish Widows, helping you build financial security for retirement.\r\n", "outgoing_links": []}, "SEC_UK_28": {"section_id": "SEC_UK_28", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Eligibility Requirements", "line_start": 239, "line_end": 254, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eEligibility Requirements\u003c/summary\u003e\r\n\r\nAutomatic enrollment if you:\r\n\r\n- Earn over £10,000 annually\r\n- Are aged 22 or over\r\n- Are under State Pension Age\r\n\r\nIf an employee does not meet these criteria then they will be considered an Entitled Worker (earn less than £6,240 p.a) or a Non-Eligible Jobholder (earn between £6,240 and £10,000 p.a).\r\n\r\nEntitled workers must be offered the opportunity to join the pension scheme. They can make contributions to the pension scheme if they choose. However, there is no requirement for GitLab to make a contribution.\r\n\r\nNon-Eligible jobholders must be offered the opportunity to opt in to an automatic enrollment scheme.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_29": {"section_id": "SEC_UK_29", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Coverage \u0026 Key Features", "line_start": 256, "line_end": 268, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003e Coverage \u0026 Key Features\u003c/summary\u003e\r\n\r\n- GitLab contributes 4% of your basic salary\r\n- You contribute 5% of your basic salary (minimum)\r\n- Annual Management Charge: 0.54%\r\n- Tax relief on your contributions (20-45% depending on tax band)\r\n- Over 50 fund options available\r\n- Salary sacrifice option available (saving on National Insurance)\r\n- Watch the [2025 UK Pension Webinar](https://drive.google.com/file/d/1ZUXJLK3v_m96yUUOpsNkX2Skh7ScdKuI/view) and review the [presentation](https://drive.google.com/file/d/1qXAIOTTMavV0pxbj6Hxm0y2k39MoJ6Rz/view) for an overview of the UK Pension System\r\n- View the [Company Pension Plan FAQ](https://drive.google.com/file/d/1BEADGm7sUbroEkxzGvB-DBIhMIbbLG46/view?usp=sharing)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "2025 UK Pension Webinar", "target_url": "https://drive.google.com/file/d/1ZUXJLK3v_m96yUUOpsNkX2Skh7ScdKuI/view", "line_number": 265}, {"anchor_text": "presentation", "target_url": "https://drive.google.com/file/d/1qXAIOTTMavV0pxbj6Hxm0y2k39MoJ6Rz/view", "line_number": 265}, {"anchor_text": "Company Pension Plan FAQ", "target_url": "https://drive.google.com/file/d/1BEADGm7sUbroEkxzGvB-DBIhMIbbLG46/view?usp=sharing", "line_number": 266}]}, "SEC_UK_30": {"section_id": "SEC_UK_30", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "How to Enroll/Access", "line_start": 270, "line_end": 288, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Enroll/Access\u003c/summary\u003e\r\n\r\n- Automatic enrollment—you'll receive a welcome pack within 14 days after payroll processing\r\n- Access your account at Scottish Widows [Portal](https://www.scottishwidows.co.uk/personal)\r\n- Increase contributions via [Compass](https://app.serval.com/new-request)\r\n\r\nThe following process is followed by GitLab People Operations to enroll the team member under the pension scheme during onboarding:\r\n\r\n1. During onboarding, the Payroll Team informs Papaya Payroll of a new hire that joined the company in the UK.\r\n2. Once Papaya payroll has this information, the employee will be set up on the payroll and added to the pension file for Scottish Widows in preparation to be uploaded.\r\n3. The pension file is sent to Scottish Widows around the end of 6th of each month and will include any joiners/changes/leavers from the previous month’s payroll run. For example everyone who has been included on the pension file in October (the cut off is 15th October) Scottish Widows will be notified around 6th November\r\n4. Any team member who joins after 20th or has not been included on the pension file will be picked up in the following month’s file.\r\n5. Scottish Widows receive the pension file around 6th of each month and will process all joiners/changes/leavers accordingly.\r\n6. New joiners should expect to receive their welcome pack in the mail within 14 working days after Scottish Widows receives the pension file.\r\n7. When a team member joins the scheme they will be sent a welcome pack in the post stating that they are now a scheme member, it will also have their login details. Team members can login to access their own personal fund and can make adjustments as they see fit.\r\n8. If the team member hasn’t received their Scottish Widows package in the mail within their first 2 months of their joining date, they can log on to their Scottish Widows [Portal](https://www.scottishwidows.co.uk/personal). Select “Register Now’, and fill out your details (no need to fill out the Policy Number, as you can use your National Insurance Number instead). Please do not try to log in via the portal before Papaya has uploaded your information in accordance to the schedule above, as you will be denied access.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Portal", "target_url": "https://www.scottishwidows.co.uk/personal", "line_number": 274}, {"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 275}, {"anchor_text": "Portal", "target_url": "https://www.scottishwidows.co.uk/personal", "line_number": 286}]}, "SEC_UK_31": {"section_id": "SEC_UK_31", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Salary Sacrifice", "line_start": 290, "line_end": 311, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eSalary Sacrifice\u003c/summary\u003e\r\n\r\nSave on National Insurance contributions while building your pension. Team members hired after 13 December 2022 are automatically enrolled. Earlier hires can opt in via [Compass](https://app.serval.com/new-request).\r\n\r\n**Salary Sacrifice FAQ**\r\n\r\n- Can we change the amount during the period we’re contracted for salary exchange?\r\n  - Yes it is possible to change the amount/increase your employee percent\r\n\r\n- What happens if our ‘actual’ salary changes during the period?\r\n  - Your employee contribution is a percent of basic pay so if your basic pay increases the pension contribution will too.\r\n\r\n- What happens if we receive a discretionary bonus?\r\n  - Your definition of pensionable pay is basic salary the percent will not automatically be applied to the bonus. Should you wish to contribute part of you bonus to your pension pot you can do that.\r\n- Is it possible to start from any month?\r\n  - Yes it is; it would be processed on the next available payroll.\r\n\r\n- My pension statements only show the Employer Contributions. Is it expected?\r\n  - Yes it is; when pension contributions are made via Salary Sacrifice, both Employee and Employer contributions will show as Employer contributions on Scottish Widows statements.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 293}]}, "SEC_UK_32": {"section_id": "SEC_UK_32", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Pension Contribution Percentages", "line_start": 313, "line_end": 330, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003ePension Contribution Percentages\u003c/summary\u003e\r\n\r\nThe certification level that has been chosen is basic salary only and will not include commission, bonuses or any over time payments. The contributions will be paid monthly and will be shown on the pay-slips.\r\n\r\n- From April 6, 2019 to a minimum of:\r\n  - Team Member: 5% of basic salary\r\n  - GitLab: 4% of basic salary\r\n\r\n- As your contribution is a percentage of your pay, the amounts will automatically increase or decrease in accordance with your basic pay. These contributions will be taken from your pay and will include tax relief.\r\n\r\n- You may increase your contribution percentage by contacting the Non-US Payroll team via [Compass](https://app.serval.com/new-request). The company contribution will remain fixed as outlined above. The standard **Annual Allowance** applies to all contributions (employer and employee) made to the pension plan in a tax year. Unused allowance may be carried forward for up to three tax years. Current rates are published on the [HMRC Pension Schemes rates page](https://www.gov.uk/government/publications/rates-and-allowances-pension-schemes/pension-schemes-rates). Your Annual Allowance may be reduced if your Adjusted Income exceeds the threshold limit (current rates available on the [HMRC Pension Schemes rates page](https://www.gov.uk/government/publications/rates-and-allowances-pension-schemes/pension-schemes-rates)), or if you 'flexibly access' benefits from a Defined Contribution pension arrangement. See the [Annual Allowance Fact Sheet](https://drive.google.com/file/d/1MMA-0wfzUsO70pBsweDAHK-FVc-P_iR1/view?usp=sharing) for details.\r\n\r\n- **For Team Membewrs on Relief at Source Only**: These percentages are gross percentages using the [relief at source](https://www.gov.uk/workplace-pensions/managing-your-pension) method. As basic rate tax relief is then added by the pension provider, the amount on your payslip will typically be the net amount, which is 80% of the employee’s contribution.\r\n\r\nThese contribution percentages are in line with [The Pension Regulator’s Auto-enrollment legislation](https://www.thepensionsregulator.gov.uk/en/document-library/automatic-enrolment-detailed-guidance). Should the government’s minimum contribution standards change further GitLab will contact you to advise the new levels to comply with legislation.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 324}, {"anchor_text": "HMRC Pension Schemes rates page", "target_url": "https://www.gov.uk/government/publications/rates-and-allowances-pension-schemes/pension-schemes-rates", "line_number": 324}, {"anchor_text": "HMRC Pension Schemes rates page", "target_url": "https://www.gov.uk/government/publications/rates-and-allowances-pension-schemes/pension-schemes-rates", "line_number": 324}, {"anchor_text": "Annual Allowance Fact Sheet", "target_url": "https://drive.google.com/file/d/1MMA-0wfzUsO70pBsweDAHK-FVc-P_iR1/view?usp=sharing", "line_number": 324}, {"anchor_text": "relief at source", "target_url": "https://www.gov.uk/workplace-pensions/managing-your-pension", "line_number": 326}, {"anchor_text": "The Pension Regulator’s Auto-enrollment legislation", "target_url": "https://www.thepensionsregulator.gov.uk/en/document-library/automatic-enrolment-detailed-guidance", "line_number": 328}]}, "SEC_UK_33": {"section_id": "SEC_UK_33", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Opting Out", "line_start": 332, "line_end": 344, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eOpting Out\u003c/summary\u003e\r\n\r\nIf you decide to opt out of the scheme you can do this within one month of the enrollment date by following the instructions in the information from Scottish Widows. The Opt Out deadlines are:\r\n\r\n- You have four weeks from when the Scottish Widows welcome letter is dated.\r\n- If you do opt out by this date, any contributions that have already been taken from your pay will be returned to you and you’ll be treated as if you had never joined the pension scheme.\r\n- If you don’t opt out by this date, you can stop contributing at any time, in accordance with the pension scheme rules. If you do this, both your contributions and GitLab’s, up to that point, will remain invested in your pension pot until you take your benefits.\r\n- You can opt-out by completing the [Scottish Widows Opt-out form](https://drive.google.com/file/d/1FDCXW2qa3pniHIbkJ4vSkK-C_KGmLiNa/view?usp=sharing) for Group Pension Scheme. The form must be completed, then returned to Total Rewards at total-rewards@gitlab.com\r\n- The pension provider will also be able to tell you when the one month opt-out period started, if you aren’t sure.\r\n- An opt-out from the pension scheme normally lasts for three years. If you’ve opted out, or stopped contributions to the scheme, GitLab is required to automatically enroll you into the scheme at a later date (normally every three years).\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Scottish Widows Opt-out form", "target_url": "https://drive.google.com/file/d/1FDCXW2qa3pniHIbkJ4vSkK-C_KGmLiNa/view?usp=sharing", "line_number": 340}]}, "SEC_UK_34": {"section_id": "SEC_UK_34", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Re-joining", "line_start": 346, "line_end": 351, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eRe-joining\u003c/summary\u003e\r\n\r\nIf you decide to re-join the scheme you can do so by submitting a [Compass](https://app.serval.com/new-request) ticket. You will be asked to write a letter or send an email from your personal email address. The letter will need to include the phrase I confirm I personally submitted this notice to join a workplace pension scheme. You can only re-join once in any 12 month period.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 349}]}, "SEC_UK_35": {"section_id": "SEC_UK_35", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Changing the Pension Scheme Investment Approach", "line_start": 353, "line_end": 390, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eChanging the Pension Scheme Investment Approach\u003c/summary\u003e\r\n\r\nThere’s a workplace pension webpage linked from this [document](https://drive.google.com/file/d/1e38np_Q8_s9Ty5JdbXTiMFXYVPTa20UQ/view?usp=sharing) that contains information about all the options available.\r\n\r\nWhen your policy is first set up, it’ll be set to:\r\n\r\n- ‘Pension Investment Approach’ (PIA)\r\n- A lifestyle switching approach for managing your investments as you approach retirement.\r\n- A default investment fund (such as ‘Scottish Widows Pension Portfolio Two Pension’)\r\n\r\nThe [policy website](https://personal.secure.scottishwidows.co.uk/) will tell you:\r\nAlthough you are currently invested in a Pension Investment Approach you also have other options such as investing in our range of individual funds or changing to a Premier Pension Investment Approach.\r\n\r\nRead about all these investment options, and the funds available, on the [workplace pension webpage](https://drive.google.com/file/d/1e38np_Q8_s9Ty5JdbXTiMFXYVPTa20UQ/view?usp=sharing).\r\n\r\nChanging your investment approach or funds could adversely affect your retirement income. Get advice, such as from [Oakley Financial](/handbook/total-rewards/benefits/general-and-entity-benefits/ltd-benefits-uk/).\r\n\r\n**Selecting funds online**\r\nThis is an advanced feature that carries significant risk. For team-members comfortable with this, it’s not obvious how to enable it.\r\n\r\nTo access ‘investing in our range of individual funds’ online you need to call Scottish Widows, and ask:\r\n\r\n- To come out of the lifestyle approach.\r\n- To come out of ‘Pension Investment Approach’ (PIA)\r\n- For online access to the range of funds.\r\n\r\nThe change may take a couple of days to come into effect, and they’ll write and confirm the change.\r\n\r\nHaving enabled online fund management, you can search for and select the funds on the [policy website](https://personal.secure.scottishwidows.co.uk/). The [workplace pension page](https://drive.google.com/file/d/1e38np_Q8_s9Ty5JdbXTiMFXYVPTa20UQ/view?usp=sharing) also has a link to a fund list, plus a PDF which explains:\r\n\r\n- The different groups of funds Scottish Widows offers.\r\n- A summary of each fund.\r\n- A fund fact sheet is provided for each fund with usual information such as previous performance.\r\n\r\nManagement charges vary by fund and are not on the fact sheets: use the charges sheet tool on the [workplace pension page](https://drive.google.com/file/d/1e38np_Q8_s9Ty5JdbXTiMFXYVPTa20UQ/view?usp=sharing).\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "document", "target_url": "https://drive.google.com/file/d/1e38np_Q8_s9Ty5JdbXTiMFXYVPTa20UQ/view?usp=sharing", "line_number": 356}, {"anchor_text": "policy website", "target_url": "https://personal.secure.scottishwidows.co.uk/", "line_number": 364}, {"anchor_text": "workplace pension webpage", "target_url": "https://drive.google.com/file/d/1e38np_Q8_s9Ty5JdbXTiMFXYVPTa20UQ/view?usp=sharing", "line_number": 367}, {"anchor_text": "Oakley Financial", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/ltd-benefits-uk/", "line_number": 369}, {"anchor_text": "policy website", "target_url": "https://personal.secure.scottishwidows.co.uk/", "line_number": 382}, {"anchor_text": "workplace pension page", "target_url": "https://drive.google.com/file/d/1e38np_Q8_s9Ty5JdbXTiMFXYVPTa20UQ/view?usp=sharing", "line_number": 382}, {"anchor_text": "workplace pension page", "target_url": "https://drive.google.com/file/d/1e38np_Q8_s9Ty5JdbXTiMFXYVPTa20UQ/view?usp=sharing", "line_number": 388}]}, "SEC_UK_36": {"section_id": "SEC_UK_36", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Bonus Contributions to UK Pension", "line_start": 392, "line_end": 402, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eBonus Contributions to UK Pension\u003c/summary\u003e\r\n\r\nIf you'd like to direct your bonus payments to your UK Pension, you can submit a request through [Compass](https://app.serval.com/new-request) before the payroll cutoff. Please note:\r\n\r\n- Ahead of company-wide bonus payouts (May and November), you must notify the Payroll team before the [cutoff period](https://internal.gitlab.com/handbook/finance/payroll/) for that month. This request must be submitted for each bonus payout period individually — it cannot be set up as a standing/permanent request.\r\n- Bonus contributions will be applied as a Salary Sacrifice if you are enrolled in the salary sacrifice feature of the scheme. If you were hired after 13 December 2022, you were automatically enrolled in salary sacrifice. If you are not enrolled under salary sacrifice, contributions will instead be made as relief-at-source contribution.\r\n- Bonus contributions must be made in full — partial contributions are not permitted.\r\n- Individuals should consider their Annual Allowance (including any carry forward) and any potential tapered Annual Allowance impact. Tracking these amounts is your own responsibility.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 395}, {"anchor_text": "cutoff period", "target_url": "https://internal.gitlab.com/handbook/finance/payroll/", "line_number": 397}]}, "SEC_UK_37": {"section_id": "SEC_UK_37", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Financial Security", "Pension Scheme"], "disclosure_title": "Contact Information", "line_start": 404, "line_end": 411, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eContact Information\u003c/summary\u003e\r\n\r\n- Scottish Widows: 0345 755 6557 | www.scottishwidows.co.uk/gppae\r\n- Willis Towers Watson - Rachel Haggarty: 07385 558317 | rachel.haggarty@wtw.com\r\n\r\nWillis Towers Watson act as employee benefit advisers to the GitLab GPPP and although cannot provide you with financial advice are available to explain the details of the GitLab GPPP and answer any questions you may have.\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_38": {"section_id": "SEC_UK_38", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Bike to Work/Tax Saver Commuter Scheme"], "disclosure_title": null, "line_start": 413, "line_end": 415, "raw_text": "## Bike to Work/Tax Saver Commuter Scheme\r\n\r\nPurchase a bike and accessories tax-efficiently through salary sacrifice.\r\n", "outgoing_links": []}, "SEC_UK_39": {"section_id": "SEC_UK_39", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Bike to Work/Tax Saver Commuter Scheme"], "disclosure_title": "Key Features", "line_start": 417, "line_end": 425, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eKey Features\u003c/summary\u003e\r\n\r\n- Up to £3,000 for bike and accessories\r\n- Tax and National Insurance savings\r\n- Available once every 4 tax years\r\n- Access via [GitLab Travel Hub](https://gitlab.biketowork.co.uk/)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "GitLab Travel Hub", "target_url": "https://gitlab.biketowork.co.uk/", "line_number": 423}]}, "SEC_UK_40": {"section_id": "SEC_UK_40", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Bike to Work/Tax Saver Commuter Scheme"], "disclosure_title": "How to Access", "line_start": 427, "line_end": 436, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Access\u003c/summary\u003e\r\n\r\n1. Register at GitLab Travel Hub\r\n2. Select a partner shop and get a quote\r\n3. Upload quote for approval\r\n4. Total Rewards reviews and approves\r\n5. Salary reduction arranged through payroll\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_41": {"section_id": "SEC_UK_41", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves"], "disclosure_title": null, "line_start": 438, "line_end": 440, "raw_text": "## Growing Family leaves\r\n\r\nSupporting you through life's biggest moments. GitLab offers comprehensive parental leave benefits combining UK statutory entitlements with our [enhanced global policy](/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave).\r\n", "outgoing_links": [{"anchor_text": "enhanced global policy", "target_url": "/handbook/total-rewards/benefits/general-and-entity-benefits/#parental-leave", "line_number": 440}]}, "SEC_UK_42": {"section_id": "SEC_UK_42", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Maternity Leave"], "disclosure_title": null, "line_start": 442, "line_end": 442, "raw_text": "### Maternity Leave\r\n", "outgoing_links": []}, "SEC_UK_43": {"section_id": "SEC_UK_43", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Maternity Leave"], "disclosure_title": "Leave Entitlement", "line_start": 444, "line_end": 453, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n- Team members must have continuous employment with GitLab for at least 26 weeks leading up to the \"qualifying week\" (15th week before the expected week of childbirth)\r\n- Up to 52 weeks leave available\r\n- First 39 weeks paid (combining statutory and GitLab benefits)\r\n- 90% of average earnings for first 6 weeks (before tax), then statutory rate (£194.32/week) or 90% (whichever is lower) of the team member's average weekly earnings (whichever is lower) for the next 33 weeks. This also applies to the leave amounts provided for Parental Leave and Adoption Leave.\r\n- GitLab's enhanced policy provides up to 16 weeks at 100% salary\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_44": {"section_id": "SEC_UK_44", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Maternity Leave"], "disclosure_title": "How to Apply", "line_start": 455, "line_end": 464, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Apply\u003c/summary\u003e\r\n\r\n- Submit leave request in Workday (Parental Leave category) 30+ days before start\r\n- Send [MATB1 Certificate](https://www.gov.uk/government/publications/maternity-certificate-mat-b1-guidance-for-health-professionals/ee03eb40-34b3-4930-8715-9cab858421ef) to leaves@gitlab.com at least 21 days before leave\r\n- The Absence Management team will then complete a [Risk Assessment Form](https://docs.google.com/document/d/1qHdbaeFSnqdwkQDTEurHD5QMbLPLuZGBQO_CBnRkpiE/edit) within 1-3 days of receiving notification of your leave. The purpose of the assessment is to make the team member aware of any hazards or \"risks\" to her in the workplace/home office to reduce potential injury to her or her baby.\r\n- The Absence Management team will notify payroll and email Vistra a copy of the MATB1, start date of leave, and outline what pay the team member is eligible for (statutory, supplemental, etc). Payroll will then automatically calculate the SMP due each pay period based on this information. The recovery of 90% will be outlined on the monthly payroll spreadsheet so that the finance team has indication of the amounts being offset each month.\r\n- Payroll will continue to be the same while on parental leave but Vistra will file for reimbursement of any statutory funds once the proper paperwork has been sent. If you do not qualify for Statutory Maternity Pay, you may qualify for [Maternity Allowance](https://www.gov.uk/maternity-allowance).\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "MATB1 Certificate", "target_url": "https://www.gov.uk/government/publications/maternity-certificate-mat-b1-guidance-for-health-professionals/ee03eb40-34b3-4930-8715-9cab858421ef", "line_number": 459}, {"anchor_text": "Risk Assessment Form", "target_url": "https://docs.google.com/document/d/1qHdbaeFSnqdwkQDTEurHD5QMbLPLuZGBQO_CBnRkpiE/edit", "line_number": 460}, {"anchor_text": "Maternity Allowance", "target_url": "https://www.gov.uk/maternity-allowance", "line_number": 462}]}, "SEC_UK_45": {"section_id": "SEC_UK_45", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Paternity Leave"], "disclosure_title": null, "line_start": 466, "line_end": 466, "raw_text": "### Paternity Leave\r\n", "outgoing_links": []}, "SEC_UK_46": {"section_id": "SEC_UK_46", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Paternity Leave"], "disclosure_title": "Leave Entitlement", "line_start": 468, "line_end": 477, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n- Effective 6 April 2026, eligibility for Statutory Paternity Leave starts from a team member's first day of employment. The previous requirement of 26 weeks of continuous service is abolished.\r\n- Team members can receive Statutory Paternity Pay for up to 2 weeks or up to 37 weeks if taking Shared Parental Leave\r\n- Eligible team members are entitled to £194.32 or 90% of the team member's average weekly earnings (whichever is lower) for up to 2 weeks OR up to 37 weeks if taking Shared Parental Leave\r\n- GitLab's enhanced policy provides up to 16 weeks at 100% salary\r\n- Leave must be taken within 52 weeks of the child's birth\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_47": {"section_id": "SEC_UK_47", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Paternity Leave"], "disclosure_title": "How to Apply", "line_start": 479, "line_end": 486, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Apply\u003c/summary\u003e\r\n\r\n- Submit leave request in Workday (Parental Leave Category) 30+ days before start\r\n- Send completed [SPP Form](https://www.tax.service.gov.uk/print-and-post/form/PersonalTax_iForms/1.0/SC3/sc3.xdp) or one of the [SPL Forms](https://www.acas.org.uk/shared-parental-leave-form-templates) to leaves@gitlab.com\r\n- The Absence Management team will notify payroll and email Vistra a copy of the form, dates of leave and outline what pay the team member is eligible for (statutory, supplemental, etc).\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "SPP Form", "target_url": "https://www.tax.service.gov.uk/print-and-post/form/PersonalTax_iForms/1.0/SC3/sc3.xdp", "line_number": 483}, {"anchor_text": "SPL Forms", "target_url": "https://www.acas.org.uk/shared-parental-leave-form-templates", "line_number": 483}]}, "SEC_UK_48": {"section_id": "SEC_UK_48", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Adoption Leave"], "disclosure_title": null, "line_start": 488, "line_end": 488, "raw_text": "### Adoption Leave\r\n", "outgoing_links": []}, "SEC_UK_49": {"section_id": "SEC_UK_49", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Adoption Leave"], "disclosure_title": "Leave Entitlement", "line_start": 490, "line_end": 498, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n- Up to 52 weeks leave available\r\n- Team members can receive statutory adoption pay for up to 39 weeks\r\n- Team members must have had continuous employment with GitLab for at least 26 weeks leading up to the week they were matched with the child.\r\n- Eligible team members are entitled to 90% of your average weekly earnings (before tax) for the first 6 weeks, £194.32 or 90% of your average weekly earnings (whichever is lower) for the next 33 weeks\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_50": {"section_id": "SEC_UK_50", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Adoption Leave"], "disclosure_title": "How to Apply", "line_start": 500, "line_end": 507, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Apply\u003c/summary\u003e\r\n\r\n- Submit leave request in Workday (Parental Leave Category) 30+ days before start\r\n- Provide proof of the adoption or surrogacy to leaves@gitlab.com\r\n- The Absence Management team will notify payroll and email Vistra a copy of the form, dates of leave and outline what pay the team member is eligible for (statutory, supplemental, etc)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_51": {"section_id": "SEC_UK_51", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Neonatal Care Leave (New from April 2025)"], "disclosure_title": null, "line_start": 509, "line_end": 509, "raw_text": "### Neonatal Care Leave (New from April 2025)\r\n", "outgoing_links": []}, "SEC_UK_52": {"section_id": "SEC_UK_52", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Neonatal Care Leave (New from April 2025)"], "disclosure_title": "Leave Entitlement", "line_start": 511, "line_end": 520, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n- Up to 12 weeks additional leave if baby requires neonatal care\r\n- Team members must have at least 26 weeks of continuous service with their employer and,\r\n- Meet the minimum earnings threshold  (Your average gross weekly earnings must be at least equal to the lower earnings limit, for April 2024-25, this is £123 per week.)\r\n- Available when baby admitted to hospital for 7+ days within first 28 days\r\n- Paid at statutory rate (Standard rate of £194.32/week or 90% of average weekly earnings, whichever is lower) with GitLab topping up to 100% salary\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_53": {"section_id": "SEC_UK_53", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Neonatal Care Leave (New from April 2025)"], "disclosure_title": "How to Apply", "line_start": 522, "line_end": 528, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Apply\u003c/summary\u003e\r\n\r\n- Tier 1: Notify leaves@gitlab.com as soon as reasonably practicable.Available when the child is in neo-natal care, and the first week after their release. The leave must be taken in 7 continuous day blocks. Overlap with a pre-booked parental leave, the SNCL can be paused to allow the other parental leave to be taken.\r\n- Tier 2: Notify leaves@gitlab.com between 15-28+ days. Available from the second week following their release, up to 68 weeks following the child’s birth. Taken as a single block, as this leave is taken when the child is out of neo-natal care and can be planned. Team members wanting to take one week SNCL\u0026P will need to give two weeks and one days' notice in advance.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_54": {"section_id": "SEC_UK_54", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Bereaved Partner's Paternity Leave (New from April 2026)"], "disclosure_title": null, "line_start": 530, "line_end": 530, "raw_text": "### Bereaved Partner's Paternity Leave (New from April 2026)\r\n", "outgoing_links": []}, "SEC_UK_55": {"section_id": "SEC_UK_55", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Bereaved Partner's Paternity Leave (New from April 2026)"], "disclosure_title": "Leave Entitlements", "line_start": 532, "line_end": 540, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLeave Entitlements\u003c/summary\u003e\r\n\r\n- Available to all team members from their first day of employment\r\n- Applies when the team member's partner (the child's mother or primary adopter) dies within the first year of the child's life or adoption\r\n- Up to 52 weeks of employment-protected leave\r\n- Leave must be used to care for the child\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_56": {"section_id": "SEC_UK_56", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Bereaved Partner's Paternity Leave (New from April 2026)"], "disclosure_title": "How to Apply", "line_start": 542, "line_end": 549, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Apply\u003c/summary\u003e\r\n\r\n- If leave begins within 8 weeks of the bereavement, notice may be given orally\r\n- If leave begins after 8 weeks, one week's written notice is required\r\n- Contact leaves@gitlab.com as soon as reasonably practicable\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_57": {"section_id": "SEC_UK_57", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Unpaid Parental Leave"], "disclosure_title": null, "line_start": 551, "line_end": 553, "raw_text": "### Unpaid Parental Leave\r\n\r\nEffective 6 April 2026, eligibility for Unpaid Parental Leave starts from a team member's first day of employment. The previous requirement of one year of continuous service is abolished.\r\n", "outgoing_links": []}, "SEC_UK_58": {"section_id": "SEC_UK_58", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Unpaid Parental Leave"], "disclosure_title": "Leave Entitlement", "line_start": 555, "line_end": 566, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n- Team members are eligible for Unpaid Parental Leave from their first day of employment.\r\n- Up to 18 weeks of unpaid leave per child, to look after their child's welfare.\r\n- The entitlement is per child up to the age of 18, regardless of the person's employer.\r\n- The balance of unpaid parental leave carries over to each employer. For example, if someone has taken 10 weeks of unpaid parental leave with their previous employer, they would be entitled to 8 weeks of leave with their new employer.\r\n- Each parent can take up to 4 weeks each year per child, unless otherwise agreed with their employer.\r\n- Leave must be taken in blocks of weeks rather than individual days.\r\n- Team members must provide at least 21 days' notice.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_59": {"section_id": "SEC_UK_59", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Unpaid Parental Leave"], "disclosure_title": "How to Apply", "line_start": 568, "line_end": 573, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Apply\u003c/summary\u003e\r\n\r\nContact leaves@gitlab.com.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_60": {"section_id": "SEC_UK_60", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Other Protected leaves"], "disclosure_title": null, "line_start": 575, "line_end": 577, "raw_text": "### Other Protected leaves\r\n\r\nSupport for all of life's responsibilities.\r\n", "outgoing_links": []}, "SEC_UK_61": {"section_id": "SEC_UK_61", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Other Protected leaves"], "disclosure_title": "Carer's Leave", "line_start": 579, "line_end": 584, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eCarer's Leave\u003c/summary\u003e\r\n\r\n1 week unpaid leave annually to provide or arrange care for a dependent with a long-term care need.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_62": {"section_id": "SEC_UK_62", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Other Protected leaves"], "disclosure_title": "Parental Bereavement Leave", "line_start": 586, "line_end": 591, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eParental Bereavement Leave\u003c/summary\u003e\r\n\r\n2 weeks for loss of a child under 18 or if the team member has a stillbirth after 24 weeks of pregnancy.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_63": {"section_id": "SEC_UK_63", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Other Protected leaves"], "disclosure_title": "Jury Service", "line_start": 593, "line_end": 598, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eJury Service\u003c/summary\u003e\r\n\r\nTime off for civic duty. Jury Service usually lasts up to 10 days, but can last longer.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_64": {"section_id": "SEC_UK_64", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Other Protected leaves"], "disclosure_title": "Magistrate/Justice of the Peace Duty", "line_start": 600, "line_end": 605, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eMagistrate/Justice of the Peace Duty\u003c/summary\u003e\r\n\r\nLeave for required court appearances. Magistrates will need to be in court for at least 13 days or 26 half-days per year.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_65": {"section_id": "SEC_UK_65", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Other Protected leaves"], "disclosure_title": "Public Duties", "line_start": 607, "line_end": 612, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003ePublic Duties\u003c/summary\u003e\r\n\r\nReasonable time off for various public service roles - team members are entitled to a reasonable amount of time off if they are a local councillor, a school governor, a member of any statutory tribunal, a member of the managing or governing body of an educational establishment, a member of a health authority, a member of a school council or board in Scotland, a member of the Environment Agency or the Scottish Environment Protection agency, a member of the prison independent monitoring boards (England or Wales) or a member of the prison visiting committees (Scotland), a member of Scottish Water or a Water Customer Consultation Panel, or a trade union member. The amount of time should be agreed upon between the team member and the manager beforehand based on how long the duties might take, the amount of time the team member has already taken off for public duties, and how the time off will affect the business.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_66": {"section_id": "SEC_UK_66", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Other Protected leaves"], "disclosure_title": "Justice of the Peace (Scotland)", "line_start": 614, "line_end": 619, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eJustice of the Peace (Scotland)\u003c/summary\u003e\r\n\r\nAny team member who is a Justice of the Peace is entitled to leave to carry out their duties.\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_67": {"section_id": "SEC_UK_67", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Growing Family leaves", "Other Protected leaves"], "disclosure_title": null, "line_start": 621, "line_end": 621, "raw_text": "**How to Access**: Select appropriate leave type in Workday. If none applies, contact leaves@gitlab.com.\r\n", "outgoing_links": []}, "SEC_UK_68": {"section_id": "SEC_UK_68", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Time Off Policies"], "disclosure_title": null, "line_start": 623, "line_end": 623, "raw_text": "## Time Off Policies\r\n", "outgoing_links": []}, "SEC_UK_69": {"section_id": "SEC_UK_69", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Time Off Policies", "Annual Leave"], "disclosure_title": null, "line_start": 625, "line_end": 627, "raw_text": "### Annual Leave\r\n\r\nTime to recharge and refresh.\r\n", "outgoing_links": []}, "SEC_UK_70": {"section_id": "SEC_UK_70", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Time Off Policies", "Annual Leave"], "disclosure_title": "Leave Entitlement", "line_start": 629, "line_end": 636, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\n- 28 days total (20 days annual leave + 8 public holidays) as per the [statutory requirements](/handbook/people-group/time-off-and-absence/time-off-types/)\r\n- Accrues from start date\r\n- Pro-rated for part-time team members\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "statutory requirements", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/", "line_number": 632}]}, "SEC_UK_71": {"section_id": "SEC_UK_71", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Time Off Policies", "Annual Leave"], "disclosure_title": "How to Report", "line_start": 638, "line_end": 643, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Report\u003c/summary\u003e\r\n\r\n- Select \"Paid Time Off\" in Workday for vacation days\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": []}, "SEC_UK_72": {"section_id": "SEC_UK_72", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Time Off Policies", "Sick Leave"], "disclosure_title": null, "line_start": 645, "line_end": 647, "raw_text": "### Sick Leave\r\n\r\nSupport when you're unwell.\r\n", "outgoing_links": []}, "SEC_UK_73": {"section_id": "SEC_UK_73", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Time Off Policies", "Sick Leave"], "disclosure_title": "Leave Entitlement", "line_start": 649, "line_end": 658, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eLeave Entitlement\u003c/summary\u003e\r\n\r\nEffective 6 April 2026, two significant changes apply to Statutory Sick Pay eligibility and payment.\r\n\r\n- All team members are eligible for SSP from their first day of employment. The previous Lower Earnings Limit (requiring team members to earn at least GBP 125 per week to qualify) is abolished.\r\n- Statutory Sick Pay for up to 28 weeks\r\n- Runs concurrently with [GitLab Sick Time](/handbook/people-group/time-off-and-absence/time-off-types/#sick-time)\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "GitLab Sick Time", "target_url": "/handbook/people-group/time-off-and-absence/time-off-types/#sick-time", "line_number": 656}]}, "SEC_UK_74": {"section_id": "SEC_UK_74", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Time Off Policies", "Sick Leave"], "disclosure_title": "How to Report", "line_start": 660, "line_end": 667, "raw_text": "\u003cdetails markdown=\"1\"\u003e\r\n\u003csummary\u003eHow to Report\u003c/summary\u003e\r\n\r\n- 4-7 days absence: Complete [self-certification form](https://docs.google.com/document/d/1Cy-xUgWwNKroUEEJ0ut80HGVA0d3RJV5mQO-amLjoCs/edit?usp=sharing)\r\n- 7+ days absence: Provide fit note to leaves@gitlab.com\r\n- Select \"Out Sick\" in Workday\r\n\r\n\u003c/details\u003e\r\n", "outgoing_links": [{"anchor_text": "self-certification form", "target_url": "https://docs.google.com/document/d/1Cy-xUgWwNKroUEEJ0ut80HGVA0d3RJV5mQO-amLjoCs/edit?usp=sharing", "line_number": 663}]}, "SEC_UK_75": {"section_id": "SEC_UK_75", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Employer's Liability Insurance"], "disclosure_title": null, "line_start": 669, "line_end": 671, "raw_text": "## Employer's Liability Insurance\r\n\r\nView [Certificate](https://drive.google.com/file/d/1RCbwcUClPUxmkJALT9Ojk_TdTyCWOHgs/view?usp=sharing).\r\n", "outgoing_links": [{"anchor_text": "Certificate", "target_url": "https://drive.google.com/file/d/1RCbwcUClPUxmkJALT9Ojk_TdTyCWOHgs/view?usp=sharing", "line_number": 671}]}, "SEC_UK_76": {"section_id": "SEC_UK_76", "source_file": "ltd-benefits-uk.md", "source_sha256": "df0bedf886c51da9e97a8721ea41112086026e1c9dcaa84d9362a5ce944fe3a0", "heading_path": ["GitLab LTD (UK) Benefits", "Questions?"], "disclosure_title": null, "line_start": 673, "line_end": 678, "raw_text": "## Questions?\r\n\r\nFor any questions about your benefits, reach out to our support teams:\r\n\r\n- Benefits: [Compass](https://app.serval.com/new-request)\r\n- Leave of absence: leaves@gitlab.com\r\n", "outgoing_links": [{"anchor_text": "Compass", "target_url": "https://app.serval.com/new-request", "line_number": 677}]}}, "run_id": "8ce679c06eb4a50f"};
const decisions=Object.fromEntries(DATA.records.map(r=>[r.candidate_id,'pending']));
const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const pretty=x=>'<pre>'+esc(JSON.stringify(x,null,2))+'</pre>';
function draw(){const root=document.querySelector('#list');root.innerHTML='';const q=document.querySelector('#search').value.toLowerCase();
for(const r of DATA.records){if(!JSON.stringify(r).toLowerCase().includes(q))continue;const a=DATA.kos[r.ko_a_id],b=DATA.kos[r.ko_b_id];const card=document.createElement('article');card.className=decisions[r.candidate_id];
let content='<h2>'+esc(r.candidate_id)+' · '+esc(r.outcome)+'</h2><b>Decision: '+esc(decisions[r.candidate_id])+'</b>';
if(r.edge)content+='<p>'+esc(r.edge.upstream_ko_id)+' → '+esc(r.edge.dependent_ko_id)+' · '+esc(r.edge.relation_type)+'</p>';
content+='<div class="quotes">'+[a,b].map(k=>'<section><b>'+esc(k.ko_id)+'</b><pre>'+esc(k.evidence.source_quote)+'</pre><b>Applicability</b>'+pretty(k.applicability_tuples)+'<b>Conditions</b>'+pretty(k.additional_conditions)+'</section>').join('')+'</div>';
content+='<b>Justification</b><p>'+esc(r.justification)+'</p><b>Constraint notes</b>'+pretty(r.review_constraints_notes)+'<b>Exact-match checked evidence</b>'+pretty(r.evidence);
if(r.validation_errors.length)content+='<div class="warning"><b>Validation failures</b>'+pretty(r.validation_errors)+'</div>';
if(r.edge)content+='<b>Field mappings</b>'+pretty(r.edge.field_mappings);
content+='<details><summary>Parent source sections and retrieval reasons</summary>'+pretty(r.retrieval_reasons)+[...new Set([a.provenance.section_id,b.provenance.section_id])].map(id=>'<b>'+esc(id)+'</b><pre>'+esc(DATA.sections[id].raw_text)+'</pre>').join('')+'</details>';
card.innerHTML=content;
for(const [label,value] of (r.edge?[['Accept unchanged','accepted'],['Reject edge','rejected'],['Needs correction','needs_correction'],['Reset','pending']]:[['Confirm '+r.outcome,'confirmed'],['Needs correction','needs_correction'],['Reset','pending']])){const btn=document.createElement('button');btn.textContent=label;btn.disabled=value==='confirmed'&&r.validation_errors.length>0;btn.onclick=()=>{decisions[r.candidate_id]=value;draw()};card.appendChild(btn)}root.appendChild(card)}
const counts={};for(const d of Object.values(decisions))counts[d]=(counts[d]||0)+1;document.querySelector('#stats').textContent=JSON.stringify(counts)}
function download(name,obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)+'\n'],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.querySelector('#edges').onclick=()=>{const chosen=DATA.records.filter(r=>decisions[r.candidate_id]==='accepted');if(!chosen.length){alert('No edges accepted.');return}if(chosen.some(r=>!r.edge||r.validation_errors.length)){alert('Invalid record; revalidate offline.');return}download('edges_verified.json',chosen.map(r=>({...r.edge,annotation_status:'verified',reviewed_at:new Date().toISOString(),review_run_id:DATA.run_id})));};
document.querySelector('#decisions').onclick=()=>download('edge_review_decisions.json',{run_id:DATA.run_id,exported_at:new Date().toISOString(),decisions:DATA.records.map(r=>({candidate_id:r.candidate_id,model_outcome:r.model_outcome,outcome:r.outcome,decision:decisions[r.candidate_id],validation_errors:r.validation_errors}))});
document.querySelector('#corrections').onclick=()=>download('edge_corrections_needed.json',{run_id:DATA.run_id,instructions:'Use candidate IDs to edit classifications_raw.json, then run --responses-json. This queue is not the complete classifications file.',candidates:DATA.records.filter(r=>decisions[r.candidate_id]==='needs_correction')});
document.querySelector('#search').oninput=draw;draw();</script></html>
