<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="prism-token" content="__TOKEN__"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><title>PRISM · Candidate review</title><link rel="stylesheet" href="/theme.css"><header><div><span class="brand">PRISM</span><span class="edition">RELATIONSHIP REVIEW</span></div></header><nav class="tabs"><a href="/">Source</a><a href="/candidates" class="active">Connections</a><a href="/graph">Graph</a><a href="/verify">Final verification</a></nav><main class="workspace"><div class="notice">Generate model suggestions from terminal menu [6] or <code>prism propose-edges</code>. Choose Ollama or Gemini there; API keys are prompted privately and never saved. Refresh here when classification finishes.</div><p id="notice" class="muted"></p><div class="toolbar"><button id="refresh" class="primary">Refresh candidates</button><button id="export">Download candidates</button><select id="filter"><option value="pending">Pending</option><option value="all">All candidates</option><option value="needs_context">Needs context</option><option value="no_dependency">No dependency</option></select></div><p id="stats"></p><p id="error" class="error" role="alert"></p><div id="list"></div></main><script>
const token=document.querySelector('meta[name="prism-token"]').content;let data;const $=id=>document.getElementById(id);function elem(tag,text,cls){let e=document.createElement(tag);e.textContent=text;if(cls)e.className=cls;return e}async function post(url,p){let r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-PRISM-Token':token},body:JSON.stringify(p)});let v=await r.json();if(!r.ok)throw Error(v.error);return v}
async function load(){data=await(await fetch('/api/candidates')).json();$('notice').textContent=data.notice;render()}
function render(){let map=Object.fromEntries(data.nodes.map(n=>[n.key,n]));$('list').replaceChildren();let rows=data.candidates.filter(c=>$('filter').value==='all'||c.status===$('filter').value);$('stats').textContent=rows.length+' shown / '+data.candidates.length+' pairs';if(data.warnings.length)$('stats').append(elem('details',''));let warning=$('stats').querySelector('details');if(warning){warning.append(elem('summary',data.warnings.length+' retrieval notices'),elem('pre',data.warnings.join('\n')))}for(let c of rows){let card=elem('article','','panel comparison');card.append(elem('span',c.status,'badge '+c.status),elem('h2','Review connection'));let pair=elem('div','','columns');for(let key of [c.a,c.b]){let n=map[key],col=elem('section','');col.append(elem('h3',n.ko.summary),elem('p',key+' · '+n.ko.status,'muted'),elem('pre',n.ko.source_quote),elem('small',n.source_file+' · line '+n.quote_line_start));let d=elem('details','');d.append(elem('summary','Scope, watched fields and full source'),elem('pre',JSON.stringify({heading:n.section.heading_path,disclosure:n.section.disclosure_title,scope:n.ko.applicability_tuples,fields:n.ko.watched_fields,source_section:n.section.raw_text},null,2)));col.append(d);let edit=elem('button','Edit applicability');edit.type='button';edit.onclick=()=>editCandidateScope(key);col.append(edit);pair.append(col)}card.append(pair);let retrieval=elem('details','');retrieval.append(elem('summary','Candidate details'),elem('p',c.id),elem('p',c.signals.join(' | ')));card.append(retrieval);if(c.edges.length)card.append(elem('p','Saved connections: '+c.edges.join(', ')));if(c.stale_review)card.append(elem('p','Earlier pair review is stale.','error'));let note=elem('textarea','');note.placeholder='Optional comment — model reasoning is already shown above.';note.value=c.review?.note||'';
let m=c.model_proposal;if(m){let box=elem('div','','notice');box.append(elem('strong','Suggested connection'+(m.stale?' · Needs refresh':'')));let origin=elem('details','');origin.append(elem('summary','Proposal history'),elem('p',m.model+' · '+m.status));box.append(origin);if(m.error)box.append(elem('p',m.error,'error'));if(m.proposal){let p=m.proposal;box.append(elem('h3',p.decision+(p.relation_type?' / '+p.relation_type:'')),elem('p',p.direction==='a_to_b'?'Direction: left → right':p.direction==='b_to_a'?'Direction: right → left':'No direction proposed'),elem('p',p.justification),elem('pre',JSON.stringify({evidence:p.evidence,field_mappings:p.field_mappings,dimension_mapping:p.dimension_mapping,scope_notes:p.scope_notes},null,2)));if(m.status==='pending'&&!m.stale){for(let [action,label] of [['accept',p.decision==='relationship'?'Accept as saved proposal':'Accept recommendation'],...(p.decision==='relationship'?[['curate','Approve for final verification']]:[]),['reject','Reject model suggestion']]){let b=elem('button',label);b.onclick=async()=>{try{await post('/api/edge-proposal/review',{id:c.id,proposal_fingerprint:m.proposal_fingerprint,action:action==='curate'?'accept':action,curate:action==='curate',note:note.value});await load()}catch(e){$('error').textContent=e.message}};box.append(b)}if(p.decision==='relationship'){let a=elem('a','Edit direction / type / mappings in graph');a.href='/graph?proposal='+encodeURIComponent(c.id);a.style.marginLeft='15px';box.append(a)}}}card.append(box)}card.append(note);let actions=elem('div','','toolbar');for(let [a,b,label] of [[c.a,c.b,'Manual left → right'],[c.b,c.a,'Manual right → left']]){let link=elem('a',label);link.href='/graph?source='+encodeURIComponent(a)+'&target='+encodeURIComponent(b);actions.append(link)}for(let [decision,label] of [['no_dependency','No dependency'],['needs_context','Needs context'],['pending','Reset to pending']]){let b=elem('button',label);b.onclick=async()=>{try{await post('/api/candidates/review',{id:c.id,fingerprint:c.fingerprint,decision,note:note.value});await load()}catch(e){$('error').textContent=e.message}};actions.append(b)}card.append(actions);$('list').append(card)}if(!rows.length)$('list').append(elem('p','No candidates in this filter. Extract or import KOs, then refresh.','empty'))}
$('filter').onchange=render;$('refresh').onclick=()=>load().catch(e=>$('error').textContent=e.message);$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let a=elem('a','');a.href=u;a.download='prism_candidates.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};load().catch(e=>$('error').textContent=e.message);
</script><script src="/candidate_scope.js"></script><script src="/workspace.js"></script></html>
